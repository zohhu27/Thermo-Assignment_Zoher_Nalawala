var pages = {"12.12": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.12 - P-x-y diagram<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  canvas { width: 100%; max-width: 800px; border: 1px solid #ccc; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.12 - P-x-y diagram using Wilson equation<\/h1>\n  <p>System: Water (1) / 1,4-Dioxane (2) at T = 333.15 K (60 &deg;C)<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Temperature T (K)<\/label> <input id=\"T\" value=\"333.15\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <label>V1 water (cm3/mol)<\/label> <input id=\"V1\" value=\"18.07\"><br>\n  <label>V2 dioxane (cm3/mol)<\/label> <input id=\"V2\" value=\"85.71\"><br>\n  <label>a12 (cal/mol)<\/label> <input id=\"a12\" value=\"1696.98\"><br>\n  <label>a21 (cal/mol)<\/label> <input id=\"a21\" value=\"-219.39\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Water A, B, C<\/label>\n  <input id=\"A1\" value=\"16.3872\"> <input id=\"B1\" value=\"3885.70\"> <input id=\"C1\" value=\"230.170\"><br>\n  <label>Dioxane A, B, C<\/label>\n  <input id=\"A2\" value=\"15.0967\"> <input id=\"B2\" value=\"3579.78\"> <input id=\"C2\" value=\"240.337\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Step 1.<\/b> Find the vapor pressure of pure water and pure dioxane at 60 &deg;C with the Antoine equation.<\/p>\n  <p><b>Step 2.<\/b> Find the Wilson parameters:<br>\n     &Lambda;12 = (V2/V1) exp(-a12 / RT) and &Lambda;21 = (V1/V2) exp(-a21 / RT)<\/p>\n  <p><b>Step 3.<\/b> For each x1, find the activity coefficients &gamma;1 and &gamma;2 from the Wilson equation.<\/p>\n  <p><b>Step 4.<\/b> Use Eq. (10.5): y<sub>i<\/sub> P = x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub>. Add for both components to get<br>\n     P = x1 &gamma;1 Psat1 + x2 &gamma;2 Psat2 &nbsp; and then &nbsp; y1 = x1 &gamma;1 Psat1 / P<\/p>\n  <p><b>Step 5.<\/b> Plot P against x1 (bubble line) and P against y1 (dew line).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<div class=\"box\">\n  <h2>4. P-x-y diagram<\/h2>\n  <canvas id=\"graph\" width=\"800\" height=\"450\"><\/canvas>\n  <p class=\"small\">Blue = P vs x1 (bubble line), Red = P vs y1 (dew line), Grey dashed = Raoult's law (ideal).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>5. Table<\/h2>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// store the results here so the graph can use them\nvar xs = [], ys = [], Ps = [], g1s = [], g2s = [];\n\nfunction solve() {\n  var T = get(\"T\"), R = get(\"R\");\n  var V1 = get(\"V1\"), V2 = get(\"V2\");\n  var a12 = get(\"a12\"), a21 = get(\"a21\");\n  var t = T - 273.15;   // temperature in celsius\n\n  // Step 1: saturation pressures (kPa)\n  var P1sat = Math.exp(get(\"A1\") - get(\"B1\") / (t + get(\"C1\")));\n  var P2sat = Math.exp(get(\"A2\") - get(\"B2\") / (t + get(\"C2\")));\n\n  // Step 2: Wilson parameters\n  var L12 = (V2 / V1) * Math.exp(-a12 / (R * T));\n  var L21 = (V1 / V2) * Math.exp(-a21 / (R * T));\n\n  xs = []; ys = []; Ps = []; g1s = []; g2s = [];\n\n  // Steps 3 and 4: loop over x1 from 0 to 1\n  for (var i = 0; i <= 20; i++) {\n    var x1 = i / 20;\n    var x2 = 1 - x1;\n\n    // small number instead of exact 0 or 1 to avoid log(0)\n    if (x1 == 0) { x1 = 0.000001; x2 = 1 - x1; }\n    if (x2 == 0) { x2 = 0.000001; x1 = 1 - x2; }\n\n    var d1 = x1 + L12 * x2;\n    var d2 = x2 + L21 * x1;\n    var common = L12 / d1 - L21 / d2;\n\n    var g1 = Math.exp(-Math.log(d1) + x2 * common);\n    var g2 = Math.exp(-Math.log(d2) - x1 * common);\n\n    var P = x1 * g1 * P1sat + x2 * g2 * P2sat;\n    var y1 = x1 * g1 * P1sat / P;\n\n    xs.push(i / 20);\n    ys.push(y1);\n    Ps.push(P);\n    g1s.push(g1);\n    g2s.push(g2);\n  }\n\n  // look for azeotrope: where y1 - x1 changes sign\n  var azText = \"No azeotrope found.\";\n  for (var k = 1; k < 20; k++) {\n    var d_a = ys[k] - xs[k];\n    var d_b = ys[k + 1] - xs[k + 1];\n    if (d_a * d_b < 0) {\n      // linear interpolation between the two points\n      var frac = d_a / (d_a - d_b);\n      var xaz = xs[k] + frac * (xs[k + 1] - xs[k]);\n      var Paz = Ps[k] + frac * (Ps[k + 1] - Ps[k]);\n      azText = \"Azeotrope (approx.): x1 = y1 = \" + xaz.toFixed(3) + \" at P = \" + Paz.toFixed(2) + \" kPa\";\n    }\n  }\n\n  document.getElementById(\"answers\").innerHTML =\n    \"Psat water = \" + P1sat.toFixed(3) + \" kPa<br>\" +\n    \"Psat dioxane = \" + P2sat.toFixed(3) + \" kPa<br>\" +\n    \"Lambda12 = \" + L12.toFixed(4) + \", Lambda21 = \" + L21.toFixed(4) + \"<br>\" +\n    azText;\n\n  fillTable();\n  drawGraph(P1sat, P2sat);\n}\n\nfunction fillTable() {\n  var html = \"<tr><th>x1<\/th><th>y1<\/th><th>gamma1<\/th><th>gamma2<\/th><th>P (kPa)<\/th><\/tr>\";\n  // show only every 2nd point, so the table goes in steps of 0.1\n  // (the graph still uses all points so the curves look smooth)\n  for (var i = 0; i < xs.length; i += 2) {\n    html += \"<tr><td>\" + xs[i].toFixed(2) + \"<\/td><td>\" + ys[i].toFixed(4) + \"<\/td><td>\" +\n            g1s[i].toFixed(3) + \"<\/td><td>\" + g2s[i].toFixed(3) + \"<\/td><td>\" + Ps[i].toFixed(2) + \"<\/td><\/tr>\";\n  }\n  document.getElementById(\"table\").innerHTML = html;\n}\n\nfunction drawGraph(P1sat, P2sat) {\n  var c = document.getElementById(\"graph\");\n  var g = c.getContext(\"2d\");\n  g.clearRect(0, 0, c.width, c.height);\n\n  var left = 60, right = 20, top = 20, bottom = 50;\n  var w = c.width - left - right, h = c.height - top - bottom;\n\n  // y axis range\n  var pmin = Math.min.apply(null, Ps.concat([P1sat, P2sat])) - 2;\n  var pmax = Math.max.apply(null, Ps.concat([P1sat, P2sat])) + 2;\n  pmin = Math.floor(pmin); pmax = Math.ceil(pmax);\n\n  function X(x) { return left + x * w; }\n  function Y(p) { return top + h - (p - pmin) / (pmax - pmin) * h; }\n\n  // axes and grid\n  g.strokeStyle = \"#ddd\"; g.fillStyle = \"#333\"; g.font = \"12px Verdana\"; g.lineWidth = 1;\n  for (var i = 0; i <= 10; i++) {\n    g.beginPath(); g.moveTo(X(i / 10), top); g.lineTo(X(i / 10), top + h); g.stroke();\n    g.fillText((i / 10).toFixed(1), X(i / 10) - 8, top + h + 18);\n  }\n  for (var j = 0; j <= 6; j++) {\n    var p = pmin + (pmax - pmin) * j / 6;\n    g.beginPath(); g.moveTo(left, Y(p)); g.lineTo(left + w, Y(p)); g.stroke();\n    g.fillText(p.toFixed(1), 8, Y(p) + 4);\n  }\n  g.strokeStyle = \"#000\";\n  g.strokeRect(left, top, w, h);\n  g.fillText(\"x1, y1 (mole fraction of water)\", left + w / 2 - 90, c.height - 10);\n  g.fillText(\"P (kPa)\", 5, 14);\n\n  // bubble line (P vs x1)\n  g.strokeStyle = \"blue\"; g.lineWidth = 2; g.beginPath();\n  for (var a = 0; a < xs.length; a++) {\n    if (a == 0) g.moveTo(X(xs[a]), Y(Ps[a])); else g.lineTo(X(xs[a]), Y(Ps[a]));\n  }\n  g.stroke();\n\n  // dew line (P vs y1)\n  g.strokeStyle = \"red\"; g.beginPath();\n  for (var b = 0; b < xs.length; b++) {\n    if (b == 0) g.moveTo(X(ys[b]), Y(Ps[b])); else g.lineTo(X(ys[b]), Y(Ps[b]));\n  }\n  g.stroke();\n\n  // Raoult's law line (straight line between the two Psat values)\n  g.strokeStyle = \"gray\"; g.lineWidth = 1; g.setLineDash([6, 4]);\n  g.beginPath(); g.moveTo(X(0), Y(P2sat)); g.lineTo(X(1), Y(P1sat)); g.stroke();\n  g.setLineDash([]);\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.13": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.13 - t-x-y diagram<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  canvas { width: 100%; max-width: 800px; border: 1px solid #ccc; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.13 - t-x-y diagram using Wilson equation<\/h1>\n  <p>System: Water (1) / 1,4-Dioxane (2) at P = 101.33 kPa<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Pressure P (kPa)<\/label> <input id=\"P\" value=\"101.33\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <label>V1 water (cm3/mol)<\/label> <input id=\"V1\" value=\"18.07\"><br>\n  <label>V2 dioxane (cm3/mol)<\/label> <input id=\"V2\" value=\"85.71\"><br>\n  <label>a12 (cal/mol)<\/label> <input id=\"a12\" value=\"1696.98\"><br>\n  <label>a21 (cal/mol)<\/label> <input id=\"a21\" value=\"-219.39\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Water A, B, C<\/label>\n  <input id=\"A1\" value=\"16.3872\"> <input id=\"B1\" value=\"3885.70\"> <input id=\"C1\" value=\"230.170\"><br>\n  <label>Dioxane A, B, C<\/label>\n  <input id=\"A2\" value=\"15.0967\"> <input id=\"B2\" value=\"3579.78\"> <input id=\"C2\" value=\"240.337\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Idea.<\/b> Pressure is fixed (101.33 kPa), so for every x1 we must find the temperature at which the liquid just starts to boil. This is the bubble temperature.<\/p>\n  <p><b>Step 1.<\/b> Guess a temperature T. Find Psat1 and Psat2 with the Antoine equation.<\/p>\n  <p><b>Step 2.<\/b> At this T find the Wilson parameters (they change with T, so we must recalculate them every time):<br>\n     &Lambda;12 = (V2/V1) exp(-a12 / RT) and &Lambda;21 = (V1/V2) exp(-a21 / RT)<\/p>\n  <p><b>Step 3.<\/b> Find &gamma;1 and &gamma;2 from the Wilson equation, then use Eq. (10.5):<br>\n     P<sub>calc<\/sub> = x1 &gamma;1 Psat1 + x2 &gamma;2 Psat2<\/p>\n  <p><b>Step 4.<\/b> If P<sub>calc<\/sub> is not equal to 101.33 kPa, change T and repeat. The code does this automatically with the bisection method (keep halving the temperature range).<\/p>\n  <p><b>Step 5.<\/b> When P<sub>calc<\/sub> = P, that T is the bubble temperature and y1 = x1 &gamma;1 Psat1 / P.<\/p>\n  <p><b>Step 6.<\/b> Plot t against x1 (bubble line) and t against y1 (dew line).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<div class=\"box\">\n  <h2>4. t-x-y diagram<\/h2>\n  <canvas id=\"graph\" width=\"800\" height=\"450\"><\/canvas>\n  <p class=\"small\">Blue = t vs x1 (bubble line), Red = t vs y1 (dew line).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>5. Table<\/h2>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// store the results here so the graph can use them\nvar xs = [], ys = [], ts = [], g1s = [], g2s = [];\n\n// Antoine equation: returns Psat in kPa, T in Kelvin\nfunction psat(T, A, B, C) {\n  return Math.exp(A - B / ((T - 273.15) + C));\n}\n\n// Wilson equation: returns gamma1 and gamma2 at temperature T\nfunction wilson(x1, T) {\n  var R = get(\"R\"), V1 = get(\"V1\"), V2 = get(\"V2\");\n  var L12 = (V2 / V1) * Math.exp(-get(\"a12\") / (R * T));\n  var L21 = (V1 / V2) * Math.exp(-get(\"a21\") / (R * T));\n  var x2 = 1 - x1;\n  var d1 = x1 + L12 * x2;\n  var d2 = x2 + L21 * x1;\n  var common = L12 / d1 - L21 / d2;\n  var g1 = Math.exp(-Math.log(d1) + x2 * common);\n  var g2 = Math.exp(-Math.log(d2) - x1 * common);\n  return { g1: g1, g2: g2 };\n}\n\n// pressure calculated at a given x1 and T (modified Raoult's law)\nfunction pressureAt(x1, T) {\n  var g = wilson(x1, T);\n  var p1 = x1 * g.g1 * psat(T, get(\"A1\"), get(\"B1\"), get(\"C1\"));\n  var p2 = (1 - x1) * g.g2 * psat(T, get(\"A2\"), get(\"B2\"), get(\"C2\"));\n  return { P: p1 + p2, y1: p1 / (p1 + p2), g1: g.g1, g2: g.g2 };\n}\n\n// bubble temperature: bisection between 300 K and 420 K\nfunction bubbleT(x1) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (pressureAt(x1, mid).P < get(\"P\")) {\n      low = mid;     // too cold, pressure too small\n    } else {\n      high = mid;    // too hot\n    }\n  }\n  var T = (low + high) / 2;\n  var r = pressureAt(x1, T);\n  return { T: T, y1: r.y1, g1: r.g1, g2: r.g2 };\n}\n\nfunction solve() {\n  xs = []; ys = []; ts = []; g1s = []; g2s = [];\n\n  // loop over x1 from 0 to 1 in steps of 0.05\n  for (var i = 0; i <= 20; i++) {\n    var x1 = i / 20;\n    // small number instead of exact 0 or 1 to avoid log(0)\n    if (i == 0) x1 = 0.000001;\n    if (i == 20) x1 = 0.999999;\n\n    var res = bubbleT(x1);\n    xs.push(i / 20);\n    ys.push(res.y1);\n    ts.push(res.T - 273.15);   // store in celsius\n    g1s.push(res.g1);\n    g2s.push(res.g2);\n  }\n\n  // look for azeotrope: where y1 - x1 changes sign\n  var azText = \"No azeotrope found.\";\n  for (var k = 1; k < 20; k++) {\n    var d_a = ys[k] - xs[k];\n    var d_b = ys[k + 1] - xs[k + 1];\n    if (d_a * d_b < 0) {\n      var frac = d_a / (d_a - d_b);\n      var xaz = xs[k] + frac * (xs[k + 1] - xs[k]);\n      var raz = bubbleT(xaz);\n      azText = \"Azeotrope (approx.): x1 = y1 = \" + xaz.toFixed(3) + \" at t = \" + (raz.T - 273.15).toFixed(2) + \" &deg;C\";\n    }\n  }\n\n  document.getElementById(\"answers\").innerHTML =\n    \"Boiling point of pure dioxane = \" + ts[0].toFixed(2) + \" &deg;C<br>\" +\n    \"Boiling point of pure water = \" + ts[20].toFixed(2) + \" &deg;C<br>\" +\n    azText;\n\n  fillTable();\n  drawGraph();\n}\n\nfunction fillTable() {\n  var html = \"<tr><th>x1<\/th><th>y1<\/th><th>gamma1<\/th><th>gamma2<\/th><th>t (&deg;C)<\/th><\/tr>\";\n  // show only every 2nd point, so the table goes in steps of 0.1\n  for (var i = 0; i < xs.length; i += 2) {\n    html += \"<tr><td>\" + xs[i].toFixed(2) + \"<\/td><td>\" + ys[i].toFixed(4) + \"<\/td><td>\" +\n            g1s[i].toFixed(3) + \"<\/td><td>\" + g2s[i].toFixed(3) + \"<\/td><td>\" + ts[i].toFixed(2) + \"<\/td><\/tr>\";\n  }\n  document.getElementById(\"table\").innerHTML = html;\n}\n\nfunction drawGraph() {\n  var c = document.getElementById(\"graph\");\n  var g = c.getContext(\"2d\");\n  g.clearRect(0, 0, c.width, c.height);\n\n  var left = 60, right = 20, top = 20, bottom = 50;\n  var w = c.width - left - right, h = c.height - top - bottom;\n\n  // y axis range\n  var tmin = Math.floor(Math.min.apply(null, ts) - 1);\n  var tmax = Math.ceil(Math.max.apply(null, ts) + 1);\n\n  function X(x) { return left + x * w; }\n  function Y(t) { return top + h - (t - tmin) / (tmax - tmin) * h; }\n\n  // axes and grid\n  g.strokeStyle = \"#ddd\"; g.fillStyle = \"#333\"; g.font = \"12px Verdana\"; g.lineWidth = 1;\n  for (var i = 0; i <= 10; i++) {\n    g.beginPath(); g.moveTo(X(i / 10), top); g.lineTo(X(i / 10), top + h); g.stroke();\n    g.fillText((i / 10).toFixed(1), X(i / 10) - 8, top + h + 18);\n  }\n  for (var j = 0; j <= 6; j++) {\n    var t = tmin + (tmax - tmin) * j / 6;\n    g.beginPath(); g.moveTo(left, Y(t)); g.lineTo(left + w, Y(t)); g.stroke();\n    g.fillText(t.toFixed(1), 8, Y(t) + 4);\n  }\n  g.strokeStyle = \"#000\";\n  g.strokeRect(left, top, w, h);\n  g.fillText(\"x1, y1 (mole fraction of water)\", left + w / 2 - 90, c.height - 10);\n  g.fillText(\"t (deg C)\", 5, 14);\n\n  // bubble line (t vs x1)\n  g.strokeStyle = \"blue\"; g.lineWidth = 2; g.beginPath();\n  for (var a = 0; a < xs.length; a++) {\n    if (a == 0) g.moveTo(X(xs[a]), Y(ts[a])); else g.lineTo(X(xs[a]), Y(ts[a]));\n  }\n  g.stroke();\n\n  // dew line (t vs y1)\n  g.strokeStyle = \"red\"; g.beginPath();\n  for (var b = 0; b < xs.length; b++) {\n    if (b == 0) g.moveTo(X(ys[b]), Y(ts[b])); else g.lineTo(X(ys[b]), Y(ts[b]));\n  }\n  g.stroke();\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.14": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.14 - P-x-y diagram (NRTL)<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  canvas { width: 100%; max-width: 800px; border: 1px solid #ccc; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.14 - P-x-y diagram using NRTL equation<\/h1>\n  <p>System: Water (1) / 1,4-Dioxane (2) at T = 333.15 K (60 &deg;C)<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5, NRTL columns)<\/h2>\n  <label>Temperature T (K)<\/label> <input id=\"T\" value=\"333.15\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <label>b12 (cal/mol)<\/label> <input id=\"b12\" value=\"715.96\"><br>\n  <label>b21 (cal/mol)<\/label> <input id=\"b21\" value=\"548.90\"><br>\n  <label>alpha<\/label> <input id=\"alpha\" value=\"0.2920\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Water A, B, C<\/label>\n  <input id=\"A1\" value=\"16.3872\"> <input id=\"B1\" value=\"3885.70\"> <input id=\"C1\" value=\"230.170\"><br>\n  <label>Dioxane A, B, C<\/label>\n  <input id=\"A2\" value=\"15.0967\"> <input id=\"B2\" value=\"3579.78\"> <input id=\"C2\" value=\"240.337\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Step 1.<\/b> Find the vapor pressure of pure water and pure dioxane at 60 &deg;C with the Antoine equation.<\/p>\n  <p><b>Step 2.<\/b> Find the NRTL parameters:<br>\n     &tau;12 = b12 / RT, &nbsp; &tau;21 = b21 / RT, &nbsp; G12 = exp(-&alpha; &tau;12), &nbsp; G21 = exp(-&alpha; &tau;21)<\/p>\n  <p><b>Step 3.<\/b> For each x1, find the activity coefficients from the NRTL equation:<br>\n     ln &gamma;1 = x2<sup>2<\/sup> [ &tau;21 (G21 / (x1 + x2 G21))<sup>2<\/sup> + &tau;12 G12 / (x2 + x1 G12)<sup>2<\/sup> ]<br>\n     ln &gamma;2 = x1<sup>2<\/sup> [ &tau;12 (G12 / (x2 + x1 G12))<sup>2<\/sup> + &tau;21 G21 / (x1 + x2 G21)<sup>2<\/sup> ]<\/p>\n  <p><b>Step 4.<\/b> Use Eq. (10.5): y<sub>i<\/sub> P = x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub>. Add for both components to get<br>\n     P = x1 &gamma;1 Psat1 + x2 &gamma;2 Psat2 &nbsp; and then &nbsp; y1 = x1 &gamma;1 Psat1 / P<\/p>\n  <p><b>Step 5.<\/b> Plot P against x1 (bubble line) and P against y1 (dew line).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<div class=\"box\">\n  <h2>4. P-x-y diagram<\/h2>\n  <canvas id=\"graph\" width=\"800\" height=\"450\"><\/canvas>\n  <p class=\"small\">Blue = P vs x1 (bubble line), Red = P vs y1 (dew line), Grey dashed = Raoult's law (ideal).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>5. Table<\/h2>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// store the results here so the graph can use them\nvar xs = [], ys = [], Ps = [], g1s = [], g2s = [];\n\nfunction solve() {\n  var T = get(\"T\"), R = get(\"R\");\n  var b12 = get(\"b12\"), b21 = get(\"b21\"), alpha = get(\"alpha\");\n  var t = T - 273.15;   // temperature in celsius\n\n  // Step 1: saturation pressures (kPa)\n  var P1sat = Math.exp(get(\"A1\") - get(\"B1\") / (t + get(\"C1\")));\n  var P2sat = Math.exp(get(\"A2\") - get(\"B2\") / (t + get(\"C2\")));\n\n  // Step 2: NRTL parameters\n  var tau12 = b12 / (R * T);\n  var tau21 = b21 / (R * T);\n  var G12 = Math.exp(-alpha * tau12);\n  var G21 = Math.exp(-alpha * tau21);\n\n  xs = []; ys = []; Ps = []; g1s = []; g2s = [];\n\n  // Steps 3 and 4: loop over x1 from 0 to 1\n  for (var i = 0; i <= 20; i++) {\n    var x1 = i / 20;\n    var x2 = 1 - x1;\n\n    // small number instead of exact 0 or 1 to avoid log(0)\n    if (x1 == 0) { x1 = 0.000001; x2 = 1 - x1; }\n    if (x2 == 0) { x2 = 0.000001; x1 = 1 - x2; }\n\n    // Step 3: NRTL activity coefficients\n    var A = x1 + x2 * G21;\n    var B = x2 + x1 * G12;\n    var g1 = Math.exp(x2 * x2 * (tau21 * (G21 / A) * (G21 / A) + tau12 * G12 / (B * B)));\n    var g2 = Math.exp(x1 * x1 * (tau12 * (G12 / B) * (G12 / B) + tau21 * G21 / (A * A)));\n\n    var P = x1 * g1 * P1sat + x2 * g2 * P2sat;\n    var y1 = x1 * g1 * P1sat / P;\n\n    xs.push(i / 20);\n    ys.push(y1);\n    Ps.push(P);\n    g1s.push(g1);\n    g2s.push(g2);\n  }\n\n  // look for azeotrope: where y1 - x1 changes sign\n  var azText = \"No azeotrope found.\";\n  for (var k = 1; k < 20; k++) {\n    var d_a = ys[k] - xs[k];\n    var d_b = ys[k + 1] - xs[k + 1];\n    if (d_a * d_b < 0) {\n      // linear interpolation between the two points\n      var frac = d_a / (d_a - d_b);\n      var xaz = xs[k] + frac * (xs[k + 1] - xs[k]);\n      var Paz = Ps[k] + frac * (Ps[k + 1] - Ps[k]);\n      azText = \"Azeotrope (approx.): x1 = y1 = \" + xaz.toFixed(3) + \" at P = \" + Paz.toFixed(2) + \" kPa\";\n    }\n  }\n\n  document.getElementById(\"answers\").innerHTML =\n    \"Psat water = \" + P1sat.toFixed(3) + \" kPa<br>\" +\n    \"Psat dioxane = \" + P2sat.toFixed(3) + \" kPa<br>\" +\n    \"tau12 = \" + tau12.toFixed(4) + \", tau21 = \" + tau21.toFixed(4) + \"<br>\" +\n    azText;\n\n  fillTable();\n  drawGraph(P1sat, P2sat);\n}\n\nfunction fillTable() {\n  var html = \"<tr><th>x1<\/th><th>y1<\/th><th>gamma1<\/th><th>gamma2<\/th><th>P (kPa)<\/th><\/tr>\";\n  // show only every 2nd point, so the table goes in steps of 0.1\n  // (the graph still uses all points so the curves look smooth)\n  for (var i = 0; i < xs.length; i += 2) {\n    html += \"<tr><td>\" + xs[i].toFixed(2) + \"<\/td><td>\" + ys[i].toFixed(4) + \"<\/td><td>\" +\n            g1s[i].toFixed(3) + \"<\/td><td>\" + g2s[i].toFixed(3) + \"<\/td><td>\" + Ps[i].toFixed(2) + \"<\/td><\/tr>\";\n  }\n  document.getElementById(\"table\").innerHTML = html;\n}\n\nfunction drawGraph(P1sat, P2sat) {\n  var c = document.getElementById(\"graph\");\n  var g = c.getContext(\"2d\");\n  g.clearRect(0, 0, c.width, c.height);\n\n  var left = 60, right = 20, top = 20, bottom = 50;\n  var w = c.width - left - right, h = c.height - top - bottom;\n\n  // y axis range\n  var pmin = Math.min.apply(null, Ps.concat([P1sat, P2sat])) - 2;\n  var pmax = Math.max.apply(null, Ps.concat([P1sat, P2sat])) + 2;\n  pmin = Math.floor(pmin); pmax = Math.ceil(pmax);\n\n  function X(x) { return left + x * w; }\n  function Y(p) { return top + h - (p - pmin) / (pmax - pmin) * h; }\n\n  // axes and grid\n  g.strokeStyle = \"#ddd\"; g.fillStyle = \"#333\"; g.font = \"12px Verdana\"; g.lineWidth = 1;\n  for (var i = 0; i <= 10; i++) {\n    g.beginPath(); g.moveTo(X(i / 10), top); g.lineTo(X(i / 10), top + h); g.stroke();\n    g.fillText((i / 10).toFixed(1), X(i / 10) - 8, top + h + 18);\n  }\n  for (var j = 0; j <= 6; j++) {\n    var p = pmin + (pmax - pmin) * j / 6;\n    g.beginPath(); g.moveTo(left, Y(p)); g.lineTo(left + w, Y(p)); g.stroke();\n    g.fillText(p.toFixed(1), 8, Y(p) + 4);\n  }\n  g.strokeStyle = \"#000\";\n  g.strokeRect(left, top, w, h);\n  g.fillText(\"x1, y1 (mole fraction of water)\", left + w / 2 - 90, c.height - 10);\n  g.fillText(\"P (kPa)\", 5, 14);\n\n  // bubble line (P vs x1)\n  g.strokeStyle = \"blue\"; g.lineWidth = 2; g.beginPath();\n  for (var a = 0; a < xs.length; a++) {\n    if (a == 0) g.moveTo(X(xs[a]), Y(Ps[a])); else g.lineTo(X(xs[a]), Y(Ps[a]));\n  }\n  g.stroke();\n\n  // dew line (P vs y1)\n  g.strokeStyle = \"red\"; g.beginPath();\n  for (var b = 0; b < xs.length; b++) {\n    if (b == 0) g.moveTo(X(ys[b]), Y(Ps[b])); else g.lineTo(X(ys[b]), Y(Ps[b]));\n  }\n  g.stroke();\n\n  // Raoult's law line (straight line between the two Psat values)\n  g.strokeStyle = \"gray\"; g.lineWidth = 1; g.setLineDash([6, 4]);\n  g.beginPath(); g.moveTo(X(0), Y(P2sat)); g.lineTo(X(1), Y(P1sat)); g.stroke();\n  g.setLineDash([]);\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.15": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.15 - t-x-y diagram (NRTL)<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  canvas { width: 100%; max-width: 800px; border: 1px solid #ccc; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.15 - t-x-y diagram using NRTL equation<\/h1>\n  <p>System: Water (1) / 1,4-Dioxane (2) at P = 101.33 kPa<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5, NRTL columns)<\/h2>\n  <label>Pressure P (kPa)<\/label> <input id=\"P\" value=\"101.33\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <label>b12 (cal/mol)<\/label> <input id=\"b12\" value=\"715.96\"><br>\n  <label>b21 (cal/mol)<\/label> <input id=\"b21\" value=\"548.90\"><br>\n  <label>alpha<\/label> <input id=\"alpha\" value=\"0.2920\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Water A, B, C<\/label>\n  <input id=\"A1\" value=\"16.3872\"> <input id=\"B1\" value=\"3885.70\"> <input id=\"C1\" value=\"230.170\"><br>\n  <label>Dioxane A, B, C<\/label>\n  <input id=\"A2\" value=\"15.0967\"> <input id=\"B2\" value=\"3579.78\"> <input id=\"C2\" value=\"240.337\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Idea.<\/b> Pressure is fixed (101.33 kPa), so for every x1 we must find the temperature at which the liquid just starts to boil. This is the bubble temperature.<\/p>\n  <p><b>Step 1.<\/b> Guess a temperature T. Find Psat1 and Psat2 with the Antoine equation.<\/p>\n  <p><b>Step 2.<\/b> At this T find the NRTL parameters (they change with T, so we must recalculate them every time):<br>\n     &tau;12 = b12 / RT, &nbsp; &tau;21 = b21 / RT, &nbsp; G12 = exp(-&alpha; &tau;12), &nbsp; G21 = exp(-&alpha; &tau;21)<\/p>\n  <p><b>Step 3.<\/b> Find &gamma;1 and &gamma;2 from the NRTL equation:<br>\n     ln &gamma;1 = x2<sup>2<\/sup> [ &tau;21 (G21 / (x1 + x2 G21))<sup>2<\/sup> + &tau;12 G12 / (x2 + x1 G12)<sup>2<\/sup> ]<br>\n     ln &gamma;2 = x1<sup>2<\/sup> [ &tau;12 (G12 / (x2 + x1 G12))<sup>2<\/sup> + &tau;21 G21 / (x1 + x2 G21)<sup>2<\/sup> ]<br>\n     Then use Eq. (10.5): P<sub>calc<\/sub> = x1 &gamma;1 Psat1 + x2 &gamma;2 Psat2<\/p>\n  <p><b>Step 4.<\/b> If P<sub>calc<\/sub> is not equal to 101.33 kPa, change T and repeat. The code does this automatically with the bisection method (keep halving the temperature range).<\/p>\n  <p><b>Step 5.<\/b> When P<sub>calc<\/sub> = P, that T is the bubble temperature and y1 = x1 &gamma;1 Psat1 / P.<\/p>\n  <p><b>Step 6.<\/b> Plot t against x1 (bubble line) and t against y1 (dew line).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<div class=\"box\">\n  <h2>4. t-x-y diagram<\/h2>\n  <canvas id=\"graph\" width=\"800\" height=\"450\"><\/canvas>\n  <p class=\"small\">Blue = t vs x1 (bubble line), Red = t vs y1 (dew line).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>5. Table<\/h2>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// store the results here so the graph can use them\nvar xs = [], ys = [], ts = [], g1s = [], g2s = [];\n\n// Antoine equation: returns Psat in kPa, T in Kelvin\nfunction psat(T, A, B, C) {\n  return Math.exp(A - B / ((T - 273.15) + C));\n}\n\n// NRTL equation: returns gamma1 and gamma2 at temperature T\nfunction nrtl(x1, T) {\n  var R = get(\"R\"), alpha = get(\"alpha\");\n  var tau12 = get(\"b12\") / (R * T);\n  var tau21 = get(\"b21\") / (R * T);\n  var G12 = Math.exp(-alpha * tau12);\n  var G21 = Math.exp(-alpha * tau21);\n  var x2 = 1 - x1;\n  var A = x1 + x2 * G21;\n  var B = x2 + x1 * G12;\n  var g1 = Math.exp(x2 * x2 * (tau21 * (G21 / A) * (G21 / A) + tau12 * G12 / (B * B)));\n  var g2 = Math.exp(x1 * x1 * (tau12 * (G12 / B) * (G12 / B) + tau21 * G21 / (A * A)));\n  return { g1: g1, g2: g2 };\n}\n\n// pressure calculated at a given x1 and T (modified Raoult's law)\nfunction pressureAt(x1, T) {\n  var g = nrtl(x1, T);\n  var p1 = x1 * g.g1 * psat(T, get(\"A1\"), get(\"B1\"), get(\"C1\"));\n  var p2 = (1 - x1) * g.g2 * psat(T, get(\"A2\"), get(\"B2\"), get(\"C2\"));\n  return { P: p1 + p2, y1: p1 / (p1 + p2), g1: g.g1, g2: g.g2 };\n}\n\n// bubble temperature: bisection between 300 K and 420 K\nfunction bubbleT(x1) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (pressureAt(x1, mid).P < get(\"P\")) {\n      low = mid;     // too cold, pressure too small\n    } else {\n      high = mid;    // too hot\n    }\n  }\n  var T = (low + high) / 2;\n  var r = pressureAt(x1, T);\n  return { T: T, y1: r.y1, g1: r.g1, g2: r.g2 };\n}\n\nfunction solve() {\n  xs = []; ys = []; ts = []; g1s = []; g2s = [];\n\n  // loop over x1 from 0 to 1 in steps of 0.05\n  for (var i = 0; i <= 20; i++) {\n    var x1 = i / 20;\n    // small number instead of exact 0 or 1 to avoid log(0)\n    if (i == 0) x1 = 0.000001;\n    if (i == 20) x1 = 0.999999;\n\n    var res = bubbleT(x1);\n    xs.push(i / 20);\n    ys.push(res.y1);\n    ts.push(res.T - 273.15);   // store in celsius\n    g1s.push(res.g1);\n    g2s.push(res.g2);\n  }\n\n  // look for azeotrope: where y1 - x1 changes sign\n  var azText = \"No azeotrope found.\";\n  for (var k = 1; k < 20; k++) {\n    var d_a = ys[k] - xs[k];\n    var d_b = ys[k + 1] - xs[k + 1];\n    if (d_a * d_b < 0) {\n      var frac = d_a / (d_a - d_b);\n      var xaz = xs[k] + frac * (xs[k + 1] - xs[k]);\n      var raz = bubbleT(xaz);\n      azText = \"Azeotrope (approx.): x1 = y1 = \" + xaz.toFixed(3) + \" at t = \" + (raz.T - 273.15).toFixed(2) + \" &deg;C\";\n    }\n  }\n\n  document.getElementById(\"answers\").innerHTML =\n    \"Boiling point of pure dioxane = \" + ts[0].toFixed(2) + \" &deg;C<br>\" +\n    \"Boiling point of pure water = \" + ts[20].toFixed(2) + \" &deg;C<br>\" +\n    azText;\n\n  fillTable();\n  drawGraph();\n}\n\nfunction fillTable() {\n  var html = \"<tr><th>x1<\/th><th>y1<\/th><th>gamma1<\/th><th>gamma2<\/th><th>t (&deg;C)<\/th><\/tr>\";\n  // show only every 2nd point, so the table goes in steps of 0.1\n  for (var i = 0; i < xs.length; i += 2) {\n    html += \"<tr><td>\" + xs[i].toFixed(2) + \"<\/td><td>\" + ys[i].toFixed(4) + \"<\/td><td>\" +\n            g1s[i].toFixed(3) + \"<\/td><td>\" + g2s[i].toFixed(3) + \"<\/td><td>\" + ts[i].toFixed(2) + \"<\/td><\/tr>\";\n  }\n  document.getElementById(\"table\").innerHTML = html;\n}\n\nfunction drawGraph() {\n  var c = document.getElementById(\"graph\");\n  var g = c.getContext(\"2d\");\n  g.clearRect(0, 0, c.width, c.height);\n\n  var left = 60, right = 20, top = 20, bottom = 50;\n  var w = c.width - left - right, h = c.height - top - bottom;\n\n  // y axis range\n  var tmin = Math.floor(Math.min.apply(null, ts) - 1);\n  var tmax = Math.ceil(Math.max.apply(null, ts) + 1);\n\n  function X(x) { return left + x * w; }\n  function Y(t) { return top + h - (t - tmin) / (tmax - tmin) * h; }\n\n  // axes and grid\n  g.strokeStyle = \"#ddd\"; g.fillStyle = \"#333\"; g.font = \"12px Verdana\"; g.lineWidth = 1;\n  for (var i = 0; i <= 10; i++) {\n    g.beginPath(); g.moveTo(X(i / 10), top); g.lineTo(X(i / 10), top + h); g.stroke();\n    g.fillText((i / 10).toFixed(1), X(i / 10) - 8, top + h + 18);\n  }\n  for (var j = 0; j <= 6; j++) {\n    var t = tmin + (tmax - tmin) * j / 6;\n    g.beginPath(); g.moveTo(left, Y(t)); g.lineTo(left + w, Y(t)); g.stroke();\n    g.fillText(t.toFixed(1), 8, Y(t) + 4);\n  }\n  g.strokeStyle = \"#000\";\n  g.strokeRect(left, top, w, h);\n  g.fillText(\"x1, y1 (mole fraction of water)\", left + w / 2 - 90, c.height - 10);\n  g.fillText(\"t (deg C)\", 5, 14);\n\n  // bubble line (t vs x1)\n  g.strokeStyle = \"blue\"; g.lineWidth = 2; g.beginPath();\n  for (var a = 0; a < xs.length; a++) {\n    if (a == 0) g.moveTo(X(xs[a]), Y(ts[a])); else g.lineTo(X(xs[a]), Y(ts[a]));\n  }\n  g.stroke();\n\n  // dew line (t vs y1)\n  g.strokeStyle = \"red\"; g.beginPath();\n  for (var b = 0; b < xs.length; b++) {\n    if (b == 0) g.moveTo(X(ys[b]), Y(ts[b])); else g.lineTo(X(ys[b]), Y(ts[b]));\n  }\n  g.stroke();\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.16": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.16 - Wilson equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.6; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.16 - Wilson equation: BUBL P, DEW P, P,T-flash and azeotrope at T = 333.15 K<\/h1>\n  <p>System: Water (1) / 1,4-Dioxane (2), Eq. (10.5) with the Wilson equation<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Temperature T (K)<\/label> <input id=\"T\" value=\"333.15\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <label>V1 water (cm3/mol)<\/label> <input id=\"V1\" value=\"18.07\"><br>\n  <label>V2 dioxane (cm3/mol)<\/label> <input id=\"V2\" value=\"85.71\"><br>\n  <label>a12 (cal/mol)<\/label> <input id=\"a12\" value=\"1696.98\"><br>\n  <label>a21 (cal/mol)<\/label> <input id=\"a21\" value=\"-219.39\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Water A, B, C<\/label>\n  <input id=\"A1\" value=\"16.3872\"> <input id=\"B1\" value=\"3885.70\"> <input id=\"C1\" value=\"230.170\"><br>\n  <label>Dioxane A, B, C<\/label>\n  <input id=\"A2\" value=\"15.0967\"> <input id=\"B2\" value=\"3579.78\"> <input id=\"C2\" value=\"240.337\"><br>\n  <p class=\"small\">Compositions asked in the problem:<\/p>\n  <label>x1 for BUBL (part a)<\/label> <input id=\"xb\" value=\"0.3\"><br>\n  <label>y1 for DEW (part b)<\/label> <input id=\"yd\" value=\"0.3\"><br>\n  <label>z1 for flash (part c)<\/label> <input id=\"zf\" value=\"0.3\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Activity coefficients (Wilson).<\/b> &Lambda;12 = (V2/V1) exp(-a12 / RT), &Lambda;21 = (V1/V2) exp(-a21 / RT). Then<br>\n  ln &gamma;1 = -ln(x1 + &Lambda;12 x2) + x2 [ &Lambda;12/(x1 + &Lambda;12 x2) - &Lambda;21/(&Lambda;21 x1 + x2) ]<br>\n  ln &gamma;2 = -ln(x2 + &Lambda;21 x1) - x1 [ &Lambda;12/(x1 + &Lambda;12 x2) - &Lambda;21/(&Lambda;21 x1 + x2) ]<\/p>\n  <p><b>(a) BUBL P.<\/b> x1 = 0.3 and T are known. Find the activity coefficients, then P = x1 &gamma;1 Psat1 + x2 &gamma;2 Psat2 and y1 = x1 &gamma;1 Psat1 / P.<\/p>\n  <p><b>(b) DEW P.<\/b> y1 = 0.3 and T are known, but &gamma; depends on x1, which we do not know. So we guess x1 = y1, find &gamma;, find P = 1 / (y1/(&gamma;1 Psat1) + y2/(&gamma;2 Psat2)), then a new x1 = y1 P / (&gamma;1 Psat1). Repeat until the numbers stop changing.<\/p>\n  <p><b>(c) P,T-flash.<\/b> P is the average of the bubble and dew pressures, so the mixture splits into liquid and vapor. With K<sub>i<\/sub> = &gamma;i Psat<sub>i<\/sub> / P, solve the Rachford-Rice equation sum z<sub>i<\/sub>(K<sub>i<\/sub> - 1) / (1 + V(K<sub>i<\/sub> - 1)) = 0 for the vapor fraction V, then x<sub>i<\/sub> = z<sub>i<\/sub> / (1 + V(K<sub>i<\/sub> - 1)) and y<sub>i<\/sub> = K<sub>i<\/sub> x<sub>i<\/sub>. Repeat because &gamma; depends on x.<\/p>\n  <p><b>(d) Azeotrope.<\/b> At an azeotrope x1 = y1, so &gamma;1 Psat1 = &gamma;2 Psat2. The code searches for the x1 where ln(&gamma;1 Psat1 / (&gamma;2 Psat2)) = 0 (bisection). Then P<sup>az<\/sup> = &gamma;1 Psat1.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// Antoine equation: Psat in kPa, T in Kelvin\nfunction psat1(T) { return Math.exp(get(\"A1\") - get(\"B1\") / ((T - 273.15) + get(\"C1\"))); }\nfunction psat2(T) { return Math.exp(get(\"A2\") - get(\"B2\") / ((T - 273.15) + get(\"C2\"))); }\n\n// Wilson equation: gamma1 and gamma2 at x1 and T\nfunction gammas(x1, T) {\n  var R = get(\"R\"), V1 = get(\"V1\"), V2 = get(\"V2\");\n  var L12 = (V2 / V1) * Math.exp(-get(\"a12\") / (R * T));\n  var L21 = (V1 / V2) * Math.exp(-get(\"a21\") / (R * T));\n  var x2 = 1 - x1;\n  var d1 = x1 + L12 * x2;\n  var d2 = x2 + L21 * x1;\n  var common = L12 / d1 - L21 / d2;\n  return { g1: Math.exp(-Math.log(d1) + x2 * common), g2: Math.exp(-Math.log(d2) - x1 * common) };\n}\n\n// BUBL P: x1 and T are known, find P and y1\nfunction bubbleP(x1, T) {\n  var g = gammas(x1, T);\n  var p1 = x1 * g.g1 * psat1(T);\n  var p2 = (1 - x1) * g.g2 * psat2(T);\n  return { P: p1 + p2, y1: p1 / (p1 + p2) };\n}\n\n// DEW P: y1 and T are known, find P and x1 (trial and error, repeat many times)\nfunction dewP(y1, T) {\n  var x1 = y1, P = 0;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    P = 1 / (y1 / (g.g1 * psat1(T)) + (1 - y1) / (g.g2 * psat2(T)));\n    x1 = y1 * P / (g.g1 * psat1(T));      // new guess for x1\n  }\n  return { P: P, x1: x1 };\n}\n\n// P,T-flash: z1, T and P are known, find V (vapor fraction), x1 and y1\nfunction flash(z1, T, P) {\n  var x1 = z1, V = 0.5, K1 = 1, K2 = 1;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    K1 = g.g1 * psat1(T) / P;\n    K2 = g.g2 * psat2(T) / P;\n    // Rachford-Rice equation, solved for V by bisection\n    var low = 0, high = 1;\n    for (var m = 0; m < 60; m++) {\n      V = (low + high) / 2;\n      var f = z1 * (K1 - 1) / (1 + V * (K1 - 1)) + (1 - z1) * (K2 - 1) / (1 + V * (K2 - 1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xa = z1 / (1 + V * (K1 - 1));\n    var xb = (1 - z1) / (1 + V * (K2 - 1));\n    x1 = xa / (xa + xb);\n  }\n  var ya = K1 * x1, yb = K2 * (1 - x1);\n  return { V: V, x1: x1, y1: ya / (ya + yb) };\n}\n\n// BUBL T: x1 and P are known, find T by bisection\nfunction bubbleT(x1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x1, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y1: bubbleP(x1, T).y1 };\n}\n\n// DEW T: y1 and P are known, find T and x1\nfunction dewS(y1, T, P) {\n  var x1 = y1, S = 1;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    var r1 = y1 * P / (g.g1 * psat1(T));\n    var r2 = (1 - y1) * P / (g.g2 * psat2(T));\n    S = r1 + r2;\n    x1 = r1 / S;\n  }\n  return { S: S, x1: x1 };\n}\nfunction dewT(y1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y1, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x1: dewS(y1, T, P).x1 };\n}\n\nfunction solve() {\n  var T = get(\"T\");\n  var out = \"\";\n\n  // (a) BUBL P\n  var a = bubbleP(get(\"xb\"), T);\n  out += \"<b>(a) BUBL P<\/b> (x1 = \" + get(\"xb\") + \"): P = \" + a.P.toFixed(2) + \" kPa, y1 = \" + a.y1.toFixed(4) + \"<br>\";\n\n  // (b) DEW P\n  var b = dewP(get(\"yd\"), T);\n  out += \"<b>(b) DEW P<\/b> (y1 = \" + get(\"yd\") + \"): P = \" + b.P.toFixed(2) + \" kPa, x1 = \" + b.x1.toFixed(4) + \"<br>\";\n\n  // (c) P,T-flash at the average pressure\n  var Pf = (a.P + b.P) / 2;\n  var f = flash(get(\"zf\"), T, Pf);\n  out += \"<b>(c) P,T-flash<\/b> (P = \" + Pf.toFixed(2) + \" kPa, z1 = \" + get(\"zf\") + \"): V = \" + f.V.toFixed(4) +\n         \", x1 = \" + f.x1.toFixed(4) + \", y1 = \" + f.y1.toFixed(4) + \"<br>\";\n\n  // (d) azeotrope: gamma1*Psat1 = gamma2*Psat2\n  function h(x1) { var g = gammas(x1, T); return Math.log(g.g1 * psat1(T) / (g.g2 * psat2(T))); }\n  var lo = 0.0001, hi = 0.9999;\n  if (h(lo) * h(hi) < 0) {\n    for (var n = 0; n < 60; n++) {\n      var mid = (lo + hi) / 2;\n      if (h(mid) > 0) lo = mid; else hi = mid;\n    }\n    var xaz = (lo + hi) / 2;\n    var gz = gammas(xaz, T);\n    out += \"<b>(d) Azeotrope<\/b>: x1 = y1 = \" + xaz.toFixed(4) + \", P = \" + (gz.g1 * psat1(T)).toFixed(2) + \" kPa\";\n  } else {\n    out += \"<b>(d) Azeotrope<\/b>: no azeotrope at this temperature.\";\n  }\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.17": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.17 - NRTL equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding  1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xa = z1 / (1 + V * (K1 - 1));\n    var xb = (1 - z1) / (1 + V * (K2 - 1));\n    x1 = xa / (xa + xb);\n  }\n  var ya = K1 * x1, yb = K2 * (1 - x1);\n  return { V: V, x1: x1, y1: ya / (ya + yb) };\n}\n\n// BUBL T: x1 and P are known, find T by bisection\nfunction bubbleT(x1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x1, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y1: bubbleP(x1, T).y1 };\n}\n\n// DEW T: y1 and P are known, find T and x1\nfunction dewS(y1, T, P) {\n  var x1 = y1, S = 1;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    var r1 = y1 * P / (g.g1 * psat1(T));\n    var r2 = (1 - y1) * P / (g.g2 * psat2(T));\n    S = r1 + r2;\n    x1 = r1 / S;\n  }\n  return { S: S, x1: x1 };\n}\nfunction dewT(y1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y1, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x1: dewS(y1, T, P).x1 };\n}\n\nfunction solve() {\n  var T = get(\"T\");\n  var out = \"\";\n\n  // (a) BUBL P\n  var a = bubbleP(get(\"xb\"), T);\n  out += \"<b>(a) BUBL P<\/b> (x1 = \" + get(\"xb\") + \"): P = \" + a.P.toFixed(2) + \" kPa, y1 = \" + a.y1.toFixed(4) + \"<br>\";\n\n  // (b) DEW P\n  var b = dewP(get(\"yd\"), T);\n  out += \"<b>(b) DEW P<\/b> (y1 = \" + get(\"yd\") + \"): P = \" + b.P.toFixed(2) + \" kPa, x1 = \" + b.x1.toFixed(4) + \"<br>\";\n\n  // (c) P,T-flash at the average pressure\n  var Pf = (a.P + b.P) / 2;\n  var f = flash(get(\"zf\"), T, Pf);\n  out += \"<b>(c) P,T-flash<\/b> (P = \" + Pf.toFixed(2) + \" kPa, z1 = \" + get(\"zf\") + \"): V = \" + f.V.toFixed(4) +\n         \", x1 = \" + f.x1.toFixed(4) + \", y1 = \" + f.y1.toFixed(4) + \"<br>\";\n\n  // (d) azeotrope: gamma1*Psat1 = gamma2*Psat2\n  function h(x1) { var g = gammas(x1, T); return Math.log(g.g1 * psat1(T) / (g.g2 * psat2(T))); }\n  var lo = 0.0001, hi = 0.9999;\n  if (h(lo) * h(hi) < 0) {\n    for (var n = 0; n < 60; n++) {\n      var mid = (lo + hi) / 2;\n      if (h(mid) > 0) lo = mid; else hi = mid;\n    }\n    var xaz = (lo + hi) / 2;\n    var gz = gammas(xaz, T);\n    out += \"<b>(d) Azeotrope<\/b>: x1 = y1 = \" + xaz.toFixed(4) + \", P = \" + (gz.g1 * psat1(T)).toFixed(2) + \" kPa\";\n  } else {\n    out += \"<b>(d) Azeotrope<\/b>: no azeotrope at this temperature.\";\n  }\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.18": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.18 - Wilson equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.6; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.18 - Wilson equation: BUBL T, DEW T, P,T-flash and azeotrope at P = 101.33 kPa<\/h1>\n  <p>System: Water (1) / 1,4-Dioxane (2), Eq. (10.5) with the Wilson equation<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Pressure P (kPa)<\/label> <input id=\"P\" value=\"101.33\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <label>V1 water (cm3/mol)<\/label> <input id=\"V1\" value=\"18.07\"><br>\n  <label>V2 dioxane (cm3/mol)<\/label> <input id=\"V2\" value=\"85.71\"><br>\n  <label>a12 (cal/mol)<\/label> <input id=\"a12\" value=\"1696.98\"><br>\n  <label>a21 (cal/mol)<\/label> <input id=\"a21\" value=\"-219.39\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Water A, B, C<\/label>\n  <input id=\"A1\" value=\"16.3872\"> <input id=\"B1\" value=\"3885.70\"> <input id=\"C1\" value=\"230.170\"><br>\n  <label>Dioxane A, B, C<\/label>\n  <input id=\"A2\" value=\"15.0967\"> <input id=\"B2\" value=\"3579.78\"> <input id=\"C2\" value=\"240.337\"><br>\n  <p class=\"small\">Compositions asked in the problem:<\/p>\n  <label>x1 for BUBL (part a)<\/label> <input id=\"xb\" value=\"0.3\"><br>\n  <label>y1 for DEW (part b)<\/label> <input id=\"yd\" value=\"0.3\"><br>\n  <label>z1 for flash (part c)<\/label> <input id=\"zf\" value=\"0.3\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Activity coefficients (Wilson).<\/b> &Lambda;12 = (V2/V1) exp(-a12 / RT), &Lambda;21 = (V1/V2) exp(-a21 / RT). Then<br>\n  ln &gamma;1 = -ln(x1 + &Lambda;12 x2) + x2 [ &Lambda;12/(x1 + &Lambda;12 x2) - &Lambda;21/(&Lambda;21 x1 + x2) ]<br>\n  ln &gamma;2 = -ln(x2 + &Lambda;21 x1) - x1 [ &Lambda;12/(x1 + &Lambda;12 x2) - &Lambda;21/(&Lambda;21 x1 + x2) ]<\/p>\n  <p><b>(a) BUBL T.<\/b> x1 = 0.3 and P are known. Guess T, find Psat and &gamma; at that T, and calculate P. Change T by bisection until the calculated P equals 101.33 kPa. Then y1 = x1 &gamma;1 Psat1 / P.<\/p>\n  <p><b>(b) DEW T.<\/b> y1 = 0.3 and P are known. For a guessed T, find x<sub>i<\/sub> = y<sub>i<\/sub> P / (&gamma;i Psat<sub>i<\/sub>) by repeating (because &gamma; depends on x). If the sum of x<sub>i<\/sub> is more than 1, T is too low. Adjust T by bisection until the sum is 1.<\/p>\n  <p><b>(c) P,T-flash.<\/b> T is the average of the bubble and dew temperatures. With K<sub>i<\/sub> = &gamma;i Psat<sub>i<\/sub> / P, solve the Rachford-Rice equation sum z<sub>i<\/sub>(K<sub>i<\/sub> - 1) / (1 + V(K<sub>i<\/sub> - 1)) = 0 for the vapor fraction V, then x<sub>i<\/sub> = z<sub>i<\/sub> / (1 + V(K<sub>i<\/sub> - 1)) and y<sub>i<\/sub> = K<sub>i<\/sub> x<sub>i<\/sub>. Repeat because &gamma; depends on x.<\/p>\n  <p><b>(d) Azeotrope.<\/b> At an azeotrope y1 = x1. For each x1 the code finds the bubble T and y1. It then searches for the x1 where y1 - x1 = 0 (bisection) and reports that T and x1.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// Antoine equation: Psat in kPa, T in Kelvin\nfunction psat1(T) { return Math.exp(get(\"A1\") - get(\"B1\") / ((T - 273.15) + get(\"C1\"))); }\nfunction psat2(T) { return Math.exp(get(\"A2\") - get(\"B2\") / ((T - 273.15) + get(\"C2\"))); }\n\n// Wilson equation: gamma1 and gamma2 at x1 and T\nfunction gammas(x1, T) {\n  var R = get(\"R\"), V1 = get(\"V1\"), V2 = get(\"V2\");\n  var L12 = (V2 / V1) * Math.exp(-get(\"a12\") / (R * T));\n  var L21 = (V1 / V2) * Math.exp(-get(\"a21\") / (R * T));\n  var x2 = 1 - x1;\n  var d1 = x1 + L12 * x2;\n  var d2 = x2 + L21 * x1;\n  var common = L12 / d1 - L21 / d2;\n  return { g1: Math.exp(-Math.log(d1) + x2 * common), g2: Math.exp(-Math.log(d2) - x1 * common) };\n}\n\n// BUBL P: x1 and T are known, find P and y1\nfunction bubbleP(x1, T) {\n  var g = gammas(x1, T);\n  var p1 = x1 * g.g1 * psat1(T);\n  var p2 = (1 - x1) * g.g2 * psat2(T);\n  return { P: p1 + p2, y1: p1 / (p1 + p2) };\n}\n\n// DEW P: y1 and T are known, find P and x1 (trial and error, repeat many times)\nfunction dewP(y1, T) {\n  var x1 = y1, P = 0;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    P = 1 / (y1 / (g.g1 * psat1(T)) + (1 - y1) / (g.g2 * psat2(T)));\n    x1 = y1 * P / (g.g1 * psat1(T));      // new guess for x1\n  }\n  return { P: P, x1: x1 };\n}\n\n// P,T-flash: z1, T and P are known, find V (vapor fraction), x1 and y1\nfunction flash(z1, T, P) {\n  var x1 = z1, V = 0.5, K1 = 1, K2 = 1;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    K1 = g.g1 * psat1(T) / P;\n    K2 = g.g2 * psat2(T) / P;\n    // Rachford-Rice equation, solved for V by bisection\n    var low = 0, high = 1;\n    for (var m = 0; m < 60; m++) {\n      V = (low + high) / 2;\n      var f = z1 * (K1 - 1) / (1 + V * (K1 - 1)) + (1 - z1) * (K2 - 1) / (1 + V * (K2 - 1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xa = z1 / (1 + V * (K1 - 1));\n    var xb = (1 - z1) / (1 + V * (K2 - 1));\n    x1 = xa / (xa + xb);\n  }\n  var ya = K1 * x1, yb = K2 * (1 - x1);\n  return { V: V, x1: x1, y1: ya / (ya + yb) };\n}\n\n// BUBL T: x1 and P are known, find T by bisection\nfunction bubbleT(x1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x1, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y1: bubbleP(x1, T).y1 };\n}\n\n// DEW T: y1 and P are known, find T and x1\nfunction dewS(y1, T, P) {\n  var x1 = y1, S = 1;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    var r1 = y1 * P / (g.g1 * psat1(T));\n    var r2 = (1 - y1) * P / (g.g2 * psat2(T));\n    S = r1 + r2;\n    x1 = r1 / S;\n  }\n  return { S: S, x1: x1 };\n}\nfunction dewT(y1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y1, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x1: dewS(y1, T, P).x1 };\n}\n\nfunction solve() {\n  var P = get(\"P\");\n  var out = \"\";\n  function C(T) { return (T - 273.15).toFixed(2) + \" &deg;C (\" + T.toFixed(2) + \" K)\"; }\n\n  // (a) BUBL T\n  var a = bubbleT(get(\"xb\"), P);\n  out += \"<b>(a) BUBL T<\/b> (x1 = \" + get(\"xb\") + \"): T = \" + C(a.T) + \", y1 = \" + a.y1.toFixed(4) + \"<br>\";\n\n  // (b) DEW T\n  var b = dewT(get(\"yd\"), P);\n  out += \"<b>(b) DEW T<\/b> (y1 = \" + get(\"yd\") + \"): T = \" + C(b.T) + \", x1 = \" + b.x1.toFixed(4) + \"<br>\";\n\n  // (c) P,T-flash at the average temperature\n  var Tf = (a.T + b.T) / 2;\n  var f = flash(get(\"zf\"), Tf, P);\n  out += \"<b>(c) P,T-flash<\/b> (T = \" + C(Tf) + \", z1 = \" + get(\"zf\") + \"): V = \" + f.V.toFixed(4) +\n         \", x1 = \" + f.x1.toFixed(4) + \", y1 = \" + f.y1.toFixed(4) + \"<br>\";\n\n  // (d) azeotrope: y1 - x1 = 0\n  function h(x1) { return bubbleT(x1, P).y1 - x1; }\n  var lo = 0.0001, hi = 0.9999;\n  if (h(lo) * h(hi) < 0) {\n    for (var n = 0; n < 50; n++) {\n      var mid = (lo + hi) / 2;\n      if (h(mid) > 0) lo = mid; else hi = mid;\n    }\n    var xaz = (lo + hi) / 2;\n    out += \"<b>(d) Azeotrope<\/b>: x1 = y1 = \" + xaz.toFixed(4) + \", T = \" + C(bubbleT(xaz, P).T);\n  } else {\n    out += \"<b>(d) Azeotrope<\/b>: no azeotrope at this pressure.\";\n  }\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.19": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.19 - NRTL equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.6; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.19 - NRTL equation: BUBL T, DEW T, P,T-flash and azeotrope at P = 101.33 kPa<\/h1>\n  <p>System: Water (1) / 1,4-Dioxane (2), Eq. (10.5) with the NRTL equation<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Pressure P (kPa)<\/label> <input id=\"P\" value=\"101.33\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <label>b12 (cal/mol)<\/label> <input id=\"b12\" value=\"715.96\"><br>\n  <label>b21 (cal/mol)<\/label> <input id=\"b21\" value=\"548.90\"><br>\n  <label>alpha<\/label> <input id=\"alpha\" value=\"0.2920\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Water A, B, C<\/label>\n  <input id=\"A1\" value=\"16.3872\"> <input id=\"B1\" value=\"3885.70\"> <input id=\"C1\" value=\"230.170\"><br>\n  <label>Dioxane A, B, C<\/label>\n  <input id=\"A2\" value=\"15.0967\"> <input id=\"B2\" value=\"3579.78\"> <input id=\"C2\" value=\"240.337\"><br>\n  <p class=\"small\">Compositions asked in the problem:<\/p>\n  <label>x1 for BUBL (part a)<\/label> <input id=\"xb\" value=\"0.3\"><br>\n  <label>y1 for DEW (part b)<\/label> <input id=\"yd\" value=\"0.3\"><br>\n  <label>z1 for flash (part c)<\/label> <input id=\"zf\" value=\"0.3\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Activity coefficients (NRTL).<\/b> &tau;12 = b12 / RT, &tau;21 = b21 / RT, G12 = exp(-&alpha; &tau;12), G21 = exp(-&alpha; &tau;21). Then<br>\n  ln &gamma;1 = x2<sup>2<\/sup> [ &tau;21 (G21 / (x1 + x2 G21))<sup>2<\/sup> + &tau;12 G12 / (x2 + x1 G12)<sup>2<\/sup> ]<br>\n  ln &gamma;2 = x1<sup>2<\/sup> [ &tau;12 (G12 / (x2 + x1 G12))<sup>2<\/sup> + &tau;21 G21 / (x1 + x2 G21)<sup>2<\/sup> ]<\/p>\n  <p><b>(a) BUBL T.<\/b> x1 = 0.3 and P are known. Guess T, find Psat and &gamma; at that T, and calculate P. Change T by bisection until the calculated P equals 101.33 kPa. Then y1 = x1 &gamma;1 Psat1 / P.<\/p>\n  <p><b>(b) DEW T.<\/b> y1 = 0.3 and P are known. For a guessed T, find x<sub>i<\/sub> = y<sub>i<\/sub> P / (&gamma;i Psat<sub>i<\/sub>) by repeating (because &gamma; depends on x). If the sum of x<sub>i<\/sub> is more than 1, T is too low. Adjust T by bisection until the sum is 1.<\/p>\n  <p><b>(c) P,T-flash.<\/b> T is the average of the bubble and dew temperatures. With K<sub>i<\/sub> = &gamma;i Psat<sub>i<\/sub> / P, solve the Rachford-Rice equation sum z<sub>i<\/sub>(K<sub>i<\/sub> - 1) / (1 + V(K<sub>i<\/sub> - 1)) = 0 for the vapor fraction V, then x<sub>i<\/sub> = z<sub>i<\/sub> / (1 + V(K<sub>i<\/sub> - 1)) and y<sub>i<\/sub> = K<sub>i<\/sub> x<sub>i<\/sub>. Repeat because &gamma; depends on x.<\/p>\n  <p><b>(d) Azeotrope.<\/b> At an azeotrope y1 = x1. For each x1 the code finds the bubble T and y1. It then searches for the x1 where y1 - x1 = 0 (bisection) and reports that T and x1.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// Antoine equation: Psat in kPa, T in Kelvin\nfunction psat1(T) { return Math.exp(get(\"A1\") - get(\"B1\") / ((T - 273.15) + get(\"C1\"))); }\nfunction psat2(T) { return Math.exp(get(\"A2\") - get(\"B2\") / ((T - 273.15) + get(\"C2\"))); }\n\n// NRTL equation: gamma1 and gamma2 at x1 and T\nfunction gammas(x1, T) {\n  var R = get(\"R\"), alpha = get(\"alpha\");\n  var tau12 = get(\"b12\") / (R * T);\n  var tau21 = get(\"b21\") / (R * T);\n  var G12 = Math.exp(-alpha * tau12);\n  var G21 = Math.exp(-alpha * tau21);\n  var x2 = 1 - x1;\n  var A = x1 + x2 * G21;\n  var B = x2 + x1 * G12;\n  return {\n    g1: Math.exp(x2 * x2 * (tau21 * (G21 / A) * (G21 / A) + tau12 * G12 / (B * B))),\n    g2: Math.exp(x1 * x1 * (tau12 * (G12 / B) * (G12 / B) + tau21 * G21 / (A * A)))\n  };\n}\n\n// BUBL P: x1 and T are known, find P and y1\nfunction bubbleP(x1, T) {\n  var g = gammas(x1, T);\n  var p1 = x1 * g.g1 * psat1(T);\n  var p2 = (1 - x1) * g.g2 * psat2(T);\n  return { P: p1 + p2, y1: p1 / (p1 + p2) };\n}\n\n// DEW P: y1 and T are known, find P and x1 (trial and error, repeat many times)\nfunction dewP(y1, T) {\n  var x1 = y1, P = 0;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    P = 1 / (y1 / (g.g1 * psat1(T)) + (1 - y1) / (g.g2 * psat2(T)));\n    x1 = y1 * P / (g.g1 * psat1(T));      // new guess for x1\n  }\n  return { P: P, x1: x1 };\n}\n\n// P,T-flash: z1, T and P are known, find V (vapor fraction), x1 and y1\nfunction flash(z1, T, P) {\n  var x1 = z1, V = 0.5, K1 = 1, K2 = 1;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    K1 = g.g1 * psat1(T) / P;\n    K2 = g.g2 * psat2(T) / P;\n    // Rachford-Rice equation, solved for V by bisection\n    var low = 0, high = 1;\n    for (var m = 0; m < 60; m++) {\n      V = (low + high) / 2;\n      var f = z1 * (K1 - 1) / (1 + V * (K1 - 1)) + (1 - z1) * (K2 - 1) / (1 + V * (K2 - 1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xa = z1 / (1 + V * (K1 - 1));\n    var xb = (1 - z1) / (1 + V * (K2 - 1));\n    x1 = xa / (xa + xb);\n  }\n  var ya = K1 * x1, yb = K2 * (1 - x1);\n  return { V: V, x1: x1, y1: ya / (ya + yb) };\n}\n\n// BUBL T: x1 and P are known, find T by bisection\nfunction bubbleT(x1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x1, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y1: bubbleP(x1, T).y1 };\n}\n\n// DEW T: y1 and P are known, find T and x1\nfunction dewS(y1, T, P) {\n  var x1 = y1, S = 1;\n  for (var n = 0; n < 300; n++) {\n    var g = gammas(x1, T);\n    var r1 = y1 * P / (g.g1 * psat1(T));\n    var r2 = (1 - y1) * P / (g.g2 * psat2(T));\n    S = r1 + r2;\n    x1 = r1 / S;\n  }\n  return { S: S, x1: x1 };\n}\nfunction dewT(y1, P) {\n  var low = 300, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y1, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x1: dewS(y1, T, P).x1 };\n}\n\nfunction solve() {\n  var P = get(\"P\");\n  var out = \"\";\n  function C(T) { return (T - 273.15).toFixed(2) + \" &deg;C (\" + T.toFixed(2) + \" K)\"; }\n\n  // (a) BUBL T\n  var a = bubbleT(get(\"xb\"), P);\n  out += \"<b>(a) BUBL T<\/b> (x1 = \" + get(\"xb\") + \"): T = \" + C(a.T) + \", y1 = \" + a.y1.toFixed(4) + \"<br>\";\n\n  // (b) DEW T\n  var b = dewT(get(\"yd\"), P);\n  out += \"<b>(b) DEW T<\/b> (y1 = \" + get(\"yd\") + \"): T = \" + C(b.T) + \", x1 = \" + b.x1.toFixed(4) + \"<br>\";\n\n  // (c) P,T-flash at the average temperature\n  var Tf = (a.T + b.T) / 2;\n  var f = flash(get(\"zf\"), Tf, P);\n  out += \"<b>(c) P,T-flash<\/b> (T = \" + C(Tf) + \", z1 = \" + get(\"zf\") + \"): V = \" + f.V.toFixed(4) +\n         \", x1 = \" + f.x1.toFixed(4) + \", y1 = \" + f.y1.toFixed(4) + \"<br>\";\n\n  // (d) azeotrope: y1 - x1 = 0\n  function h(x1) { return bubbleT(x1, P).y1 - x1; }\n  var lo = 0.0001, hi = 0.9999;\n  if (h(lo) * h(hi) < 0) {\n    for (var n = 0; n < 50; n++) {\n      var mid = (lo + hi) / 2;\n      if (h(mid) > 0) lo = mid; else hi = mid;\n    }\n    var xaz = (lo + hi) / 2;\n    out += \"<b>(d) Azeotrope<\/b>: x1 = y1 = \" + xaz.toFixed(4) + \", T = \" + C(bubbleT(xaz, P).T);\n  } else {\n    out += \"<b>(d) Azeotrope<\/b>: no azeotrope at this pressure.\";\n  }\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.20": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.20 - Wilson equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.20 - Wilson equation: BUBL P, DEW P and P,T-flash at T = 338.15 K<\/h1>\n  <p>System: Acetone (1) / Methanol (2) / Water (3), Eq. (10.5) with the Wilson equation<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Temperature T (K)<\/label> <input id=\"T\" value=\"338.15\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <p class=\"small\">Wilson parameters from Table 12.5 (1 = acetone, 2 = methanol, 3 = water). Pairs: 1-2 acetone/methanol, 1-3 acetone/water, 2-3 methanol/water.<\/p>\n  <label>V1, V2, V3 (cm3/mol)<\/label> <input id=\"V1\" value=\"74.05\"> <input id=\"V2\" value=\"40.73\"> <input id=\"V3\" value=\"18.07\"><br>\n  <label>a12, a21 (cal/mol)<\/label> <input id=\"a12\" value=\"-161.88\"> <input id=\"a21\" value=\"583.11\"><br>\n  <label>a13, a31 (cal/mol)<\/label> <input id=\"a13\" value=\"291.27\"> <input id=\"a31\" value=\"1448.01\"><br>\n  <label>a23, a32 (cal/mol)<\/label> <input id=\"a23\" value=\"107.38\"> <input id=\"a32\" value=\"469.55\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Acetone A, B, C<\/label>\n  <input id=\"A1\" value=\"14.3145\"> <input id=\"B1\" value=\"2756.22\"> <input id=\"C1\" value=\"228.060\"><br>\n  <label>Methanol A, B, C<\/label>\n  <input id=\"A2\" value=\"16.5785\"> <input id=\"B2\" value=\"3638.27\"> <input id=\"C2\" value=\"239.500\"><br>\n  <label>Water A, B, C<\/label>\n  <input id=\"A3\" value=\"16.3872\"> <input id=\"B3\" value=\"3885.70\"> <input id=\"C3\" value=\"230.170\"><br>\n  <p class=\"small\">Compositions asked in the problem (the third component is 1 - x1 - x2):<\/p>\n  <label>x1, x2 for BUBL (part a)<\/label> <input id=\"xb1\" value=\"0.3\"> <input id=\"xb2\" value=\"0.4\"><br>\n  <label>y1, y2 for DEW (part b)<\/label> <input id=\"yd1\" value=\"0.3\"> <input id=\"yd2\" value=\"0.4\"><br>\n  <label>z1, z2 for flash (part c)<\/label> <input id=\"zf1\" value=\"0.3\"> <input id=\"zf2\" value=\"0.4\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Activity coefficients (Wilson, 3 components).<\/b> &Lambda;<sub>ij<\/sub> = (V<sub>j<\/sub>/V<sub>i<\/sub>) exp(-a<sub>ij<\/sub> / RT), with &Lambda;<sub>ii<\/sub> = 1. Then<br>\n  ln &gamma;<sub>i<\/sub> = 1 - ln( &Sigma;<sub>j<\/sub> x<sub>j<\/sub> &Lambda;<sub>ij<\/sub> ) - &Sigma;<sub>k<\/sub> [ x<sub>k<\/sub> &Lambda;<sub>ki<\/sub> / &Sigma;<sub>j<\/sub> x<sub>j<\/sub> &Lambda;<sub>kj<\/sub> ]<\/p>\n  <p><b>(a) BUBL P.<\/b> x and T are known. Find the three activity coefficients, then P = &Sigma; x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> and y<sub>i<\/sub> = x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P.<\/p>\n  <p><b>(b) DEW P.<\/b> y and T are known, but &gamma; depends on x, which we do not know. Guess x = y, find &gamma;, then P = 1 / &Sigma;( y<sub>i<\/sub> / (&gamma;<sub>i<\/sub> Psat<sub>i<\/sub>) ) and a new x<sub>i<\/sub> = y<sub>i<\/sub> P / (&gamma;<sub>i<\/sub> Psat<sub>i<\/sub>). Repeat until the numbers stop changing.<\/p>\n  <p><b>(c) P,T-flash.<\/b> P is the average of the bubble and dew pressures. With K<sub>i<\/sub> = &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P, solve the Rachford-Rice equation &Sigma; z<sub>i<\/sub>(K<sub>i<\/sub> - 1) / (1 + V(K<sub>i<\/sub> - 1)) = 0 for the vapor fraction V. Then x<sub>i<\/sub> = z<sub>i<\/sub> / (1 + V(K<sub>i<\/sub> - 1)) and y<sub>i<\/sub> = K<sub>i<\/sub> x<sub>i<\/sub>. Repeat because &gamma; depends on x.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// Antoine equation: Psat in kPa for component i (0, 1, 2), T in Kelvin\nfunction psat(i, T) {\n  var n = i + 1;\n  return Math.exp(get(\"A\" + n) - get(\"B\" + n) / ((T - 273.15) + get(\"C\" + n)));\n}\n\n// make a composition list [x1, x2, x3] from two input boxes (third = 1 - first two)\nfunction comp(id1, id2) {\n  var a = get(id1), b = get(id2);\n  return [a, b, 1 - a - b];\n}\n\n// show a list of numbers as text\nfunction show(v) {\n  return \"(\" + v[0].toFixed(4) + \", \" + v[1].toFixed(4) + \", \" + v[2].toFixed(4) + \")\";\n}\n\n// Wilson equation for 3 components: returns [gamma1, gamma2, gamma3]\nfunction gammas(x, T) {\n  var R = get(\"R\");\n  var V = [get(\"V1\"), get(\"V2\"), get(\"V3\")];\n  var a = [[0, get(\"a12\"), get(\"a13\")], [get(\"a21\"), 0, get(\"a23\")], [get(\"a31\"), get(\"a32\"), 0]];\n  var L = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];\n  for (var i = 0; i < 3; i++) {\n    for (var j = 0; j < 3; j++) {\n      if (i != j) L[i][j] = (V[j] / V[i]) * Math.exp(-a[i][j] / (R * T));\n    }\n  }\n  var S = [0, 0, 0];                       // S[i] = sum over j of x[j] * L[i][j]\n  for (var i = 0; i < 3; i++) {\n    for (var j = 0; j < 3; j++) S[i] += x[j] * L[i][j];\n  }\n  var g = [];\n  for (var i = 0; i < 3; i++) {\n    var sum = 0;\n    for (var k = 0; k < 3; k++) sum += x[k] * L[k][i] / S[k];\n    g.push(Math.exp(1 - Math.log(S[i]) - sum));\n  }\n  return g;\n}\n\n// BUBL P: x and T are known, find P and y\nfunction bubbleP(x, T) {\n  var g = gammas(x, T);\n  var p = [], P = 0;\n  for (var i = 0; i < 3; i++) { p.push(x[i] * g[i] * psat(i, T)); P += p[i]; }\n  return { P: P, y: [p[0] / P, p[1] / P, p[2] / P] };\n}\n\n// DEW P: y and T are known, find P and x (trial and error, repeat many times)\nfunction dewP(y, T) {\n  var x = [y[0], y[1], y[2]], P = 0;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var s = 0;\n    for (var i = 0; i < 3; i++) s += y[i] / (g[i] * psat(i, T));\n    P = 1 / s;\n    for (var i = 0; i < 3; i++) x[i] = y[i] * P / (g[i] * psat(i, T));\n  }\n  return { P: P, x: x };\n}\n\n// P,T-flash: z, T and P are known, find V, x and y\nfunction flash(z, T, P) {\n  var x = [z[0], z[1], z[2]], V = 0.5, K = [1, 1, 1];\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    for (var i = 0; i < 3; i++) K[i] = g[i] * psat(i, T) / P;\n    // Rachford-Rice equation, solved for V by bisection\n    var low = 0, high = 1;\n    for (var m = 0; m < 60; m++) {\n      V = (low + high) / 2;\n      var f = 0;\n      for (var i = 0; i < 3; i++) f += z[i] * (K[i] - 1) / (1 + V * (K[i] - 1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xn = [], s = 0;\n    for (var i = 0; i < 3; i++) { xn.push(z[i] / (1 + V * (K[i] - 1))); s += xn[i]; }\n    for (var i = 0; i < 3; i++) x[i] = xn[i] / s;\n  }\n  var y = [], sy = 0;\n  for (var i = 0; i < 3; i++) { y.push(K[i] * x[i]); sy += y[i]; }\n  return { V: V, x: x, y: [y[0] / sy, y[1] / sy, y[2] / sy] };\n}\n\n// BUBL T: x and P are known, find T by bisection\nfunction bubbleT(x, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y: bubbleP(x, T).y };\n}\n\n// DEW T: y and P are known, find T and x\nfunction dewS(y, T, P) {\n  var x = [y[0], y[1], y[2]], S = 1;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var r = [], S = 0;\n    for (var i = 0; i < 3; i++) { r.push(y[i] * P / (g[i] * psat(i, T))); S += r[i]; }\n    for (var i = 0; i < 3; i++) x[i] = r[i] / S;\n  }\n  return { S: S, x: x };\n}\nfunction dewT(y, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x: dewS(y, T, P).x };\n}\n\nfunction solve() {\n  var T = get(\"T\");\n  var out = \"\";\n\n  // (a) BUBL P\n  var xb = comp(\"xb1\", \"xb2\");\n  var a = bubbleP(xb, T);\n  out += \"<b>(a) BUBL P<\/b> x = \" + show(xb) + \": P = \" + a.P.toFixed(2) + \" kPa, y = \" + show(a.y) + \"<br>\";\n\n  // (b) DEW P\n  var yd = comp(\"yd1\", \"yd2\");\n  var b = dewP(yd, T);\n  out += \"<b>(b) DEW P<\/b> y = \" + show(yd) + \": P = \" + b.P.toFixed(2) + \" kPa, x = \" + show(b.x) + \"<br>\";\n\n  // (c) P,T-flash at the average pressure\n  var Pf = (a.P + b.P) / 2;\n  var zf = comp(\"zf1\", \"zf2\");\n  var f = flash(zf, T, Pf);\n  out += \"<b>(c) P,T-flash<\/b> (P = \" + Pf.toFixed(2) + \" kPa, z = \" + show(zf) + \"): V = \" + f.V.toFixed(4) +\n         \", x = \" + show(f.x) + \", y = \" + show(f.y);\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.21": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.21 - NRTL equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.21 - NRTL equation: BUBL P, DEW P and P,T-flash at T = 338.15 K<\/h1>\n  <p>System: Acetone (1) / Methanol (2) / Water (3), Eq. (10.5) with the NRTL equation<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Temperature T (K)<\/label> <input id=\"T\" value=\"338.15\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <p class=\"small\">NRTL parameters from Table 12.5 (1 = acetone, 2 = methanol, 3 = water). Pairs: 1-2 acetone/methanol, 1-3 acetone/water, 2-3 methanol/water.<\/p>\n  <label>b12, b21 (cal/mol)<\/label> <input id=\"b12\" value=\"184.70\"> <input id=\"b21\" value=\"222.64\"><br>\n  <label>b13, b31 (cal/mol)<\/label> <input id=\"b13\" value=\"631.05\"> <input id=\"b31\" value=\"1197.41\"><br>\n  <label>b23, b32 (cal/mol)<\/label> <input id=\"b23\" value=\"-253.88\"> <input id=\"b32\" value=\"845.21\"><br>\n  <label>alpha12, alpha13, alpha23<\/label> <input id=\"al12\" value=\"0.3084\"> <input id=\"al13\" value=\"0.5343\"> <input id=\"al23\" value=\"0.2994\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Acetone A, B, C<\/label>\n  <input id=\"A1\" value=\"14.3145\"> <input id=\"B1\" value=\"2756.22\"> <input id=\"C1\" value=\"228.060\"><br>\n  <label>Methanol A, B, C<\/label>\n  <input id=\"A2\" value=\"16.5785\"> <input id=\"B2\" value=\"3638.27\"> <input id=\"C2\" value=\"239.500\"><br>\n  <label>Water A, B, C<\/label>\n  <input id=\"A3\" value=\"16.3872\"> <input id=\"B3\" value=\"3885.70\"> <input id=\"C3\" value=\"230.170\"><br>\n  <p class=\"small\">Compositions asked in the problem (the third component is 1 - x1 - x2):<\/p>\n  <label>x1, x2 for BUBL (part a)<\/label> <input id=\"xb1\" value=\"0.3\"> <input id=\"xb2\" value=\"0.4\"><br>\n  <label>y1, y2 for DEW (part b)<\/label> <input id=\"yd1\" value=\"0.3\"> <input id=\"yd2\" value=\"0.4\"><br>\n  <label>z1, z2 for flash (part c)<\/label> <input id=\"zf1\" value=\"0.3\"> <input id=\"zf2\" value=\"0.4\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Activity coefficients (NRTL, 3 components).<\/b> &tau;<sub>ij<\/sub> = b<sub>ij<\/sub> / RT, G<sub>ij<\/sub> = exp(-&alpha;<sub>ij<\/sub> &tau;<sub>ij<\/sub>), with &alpha;<sub>ij<\/sub> = &alpha;<sub>ji<
