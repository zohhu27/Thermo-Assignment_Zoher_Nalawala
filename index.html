\/sub>. Then<br>\n  ln &gamma;<sub>i<\/sub> = &Sigma;<sub>j<\/sub> x<sub>j<\/sub> &tau;<sub>ji<\/sub> G<sub>ji<\/sub> / &Sigma;<sub>k<\/sub> x<sub>k<\/sub> G<sub>ki<\/sub> + &Sigma;<sub>j<\/sub> [ x<sub>j<\/sub> G<sub>ij<\/sub> / &Sigma;<sub>k<\/sub> x<sub>k<\/sub> G<sub>kj<\/sub> ] ( &tau;<sub>ij<\/sub> - &Sigma;<sub>m<\/sub> x<sub>m<\/sub> &tau;<sub>mj<\/sub> G<sub>mj<\/sub> / &Sigma;<sub>k<\/sub> x<sub>k<\/sub> G<sub>kj<\/sub> )<\/p>\n  <p><b>(a) BUBL P.<\/b> x and T are known. Find the three activity coefficients, then P = &Sigma; x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> and y<sub>i<\/sub> = x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P.<\/p>\n  <p><b>(b) DEW P.<\/b> y and T are known, but &gamma; depends on x, which we do not know. Guess x = y, find &gamma;, then P = 1 / &Sigma;( y<sub>i<\/sub> / (&gamma;<sub>i<\/sub> Psat<sub>i<\/sub>) ) and a new x<sub>i<\/sub> = y<sub>i<\/sub> P / (&gamma;<sub>i<\/sub> Psat<sub>i<\/sub>). Repeat until the numbers stop changing.<\/p>\n  <p><b>(c) P,T-flash.<\/b> P is the average of the bubble and dew pressures. With K<sub>i<\/sub> = &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P, solve the Rachford-Rice equation &Sigma; z<sub>i<\/sub>(K<sub>i<\/sub> - 1) / (1 + V(K<sub>i<\/sub> - 1)) = 0 for the vapor fraction V. Then x<sub>i<\/sub> = z<sub>i<\/sub> / (1 + V(K<sub>i<\/sub> - 1)) and y<sub>i<\/sub> = K<sub>i<\/sub> x<sub>i<\/sub>. Repeat because &gamma; depends on x.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// Antoine equation: Psat in kPa for component i (0, 1, 2), T in Kelvin\nfunction psat(i, T) {\n  var n = i + 1;\n  return Math.exp(get(\"A\" + n) - get(\"B\" + n) / ((T - 273.15) + get(\"C\" + n)));\n}\n\n// make a composition list [x1, x2, x3] from two input boxes (third = 1 - first two)\nfunction comp(id1, id2) {\n  var a = get(id1), b = get(id2);\n  return [a, b, 1 - a - b];\n}\n\n// show a list of numbers as text\nfunction show(v) {\n  return \"(\" + v[0].toFixed(4) + \", \" + v[1].toFixed(4) + \", \" + v[2].toFixed(4) + \")\";\n}\n\n// NRTL equation for 3 components: returns [gamma1, gamma2, gamma3]\nfunction gammas(x, T) {\n  var R = get(\"R\");\n  var b = [[0, get(\"b12\"), get(\"b13\")], [get(\"b21\"), 0, get(\"b23\")], [get(\"b31\"), get(\"b32\"), 0]];\n  var al = [[0, get(\"al12\"), get(\"al13\")], [get(\"al12\"), 0, get(\"al23\")], [get(\"al13\"), get(\"al23\"), 0]];\n  var tau = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];\n  var G = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];\n  for (var i = 0; i < 3; i++) {\n    for (var j = 0; j < 3; j++) {\n      if (i != j) {\n        tau[i][j] = b[i][j] / (R * T);\n        G[i][j] = Math.exp(-al[i][j] * tau[i][j]);\n      }\n    }\n  }\n  var S = [0, 0, 0];                       // S[j] = sum over k of x[k] * G[k][j]\n  var C = [0, 0, 0];                       // C[j] = sum over m of x[m] * tau[m][j] * G[m][j]\n  for (var j = 0; j < 3; j++) {\n    for (var k = 0; k < 3; k++) {\n      S[j] += x[k] * G[k][j];\n      C[j] += x[k] * tau[k][j] * G[k][j];\n    }\n  }\n  var g = [];\n  for (var i = 0; i < 3; i++) {\n    var term1 = C[i] / S[i];\n    var term2 = 0;\n    for (var j = 0; j < 3; j++) {\n      term2 += (x[j] * G[i][j] / S[j]) * (tau[i][j] - C[j] / S[j]);\n    }\n    g.push(Math.exp(term1 + term2));\n  }\n  return g;\n}\n\n// BUBL P: x and T are known, find P and y\nfunction bubbleP(x, T) {\n  var g = gammas(x, T);\n  var p = [], P = 0;\n  for (var i = 0; i < 3; i++) { p.push(x[i] * g[i] * psat(i, T)); P += p[i]; }\n  return { P: P, y: [p[0] / P, p[1] / P, p[2] / P] };\n}\n\n// DEW P: y and T are known, find P and x (trial and error, repeat many times)\nfunction dewP(y, T) {\n  var x = [y[0], y[1], y[2]], P = 0;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var s = 0;\n    for (var i = 0; i < 3; i++) s += y[i] / (g[i] * psat(i, T));\n    P = 1 / s;\n    for (var i = 0; i < 3; i++) x[i] = y[i] * P / (g[i] * psat(i, T));\n  }\n  return { P: P, x: x };\n}\n\n// P,T-flash: z, T and P are known, find V, x and y\nfunction flash(z, T, P) {\n  var x = [z[0], z[1], z[2]], V = 0.5, K = [1, 1, 1];\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    for (var i = 0; i < 3; i++) K[i] = g[i] * psat(i, T) / P;\n    // Rachford-Rice equation, solved for V by bisection\n    var low = 0, high = 1;\n    for (var m = 0; m < 60; m++) {\n      V = (low + high) / 2;\n      var f = 0;\n      for (var i = 0; i < 3; i++) f += z[i] * (K[i] - 1) / (1 + V * (K[i] - 1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xn = [], s = 0;\n    for (var i = 0; i < 3; i++) { xn.push(z[i] / (1 + V * (K[i] - 1))); s += xn[i]; }\n    for (var i = 0; i < 3; i++) x[i] = xn[i] / s;\n  }\n  var y = [], sy = 0;\n  for (var i = 0; i < 3; i++) { y.push(K[i] * x[i]); sy += y[i]; }\n  return { V: V, x: x, y: [y[0] / sy, y[1] / sy, y[2] / sy] };\n}\n\n// BUBL T: x and P are known, find T by bisection\nfunction bubbleT(x, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y: bubbleP(x, T).y };\n}\n\n// DEW T: y and P are known, find T and x\nfunction dewS(y, T, P) {\n  var x = [y[0], y[1], y[2]], S = 1;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var r = [], S = 0;\n    for (var i = 0; i < 3; i++) { r.push(y[i] * P / (g[i] * psat(i, T))); S += r[i]; }\n    for (var i = 0; i < 3; i++) x[i] = r[i] / S;\n  }\n  return { S: S, x: x };\n}\nfunction dewT(y, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x: dewS(y, T, P).x };\n}\n\nfunction solve() {\n  var T = get(\"T\");\n  var out = \"\";\n\n  // (a) BUBL P\n  var xb = comp(\"xb1\", \"xb2\");\n  var a = bubbleP(xb, T);\n  out += \"<b>(a) BUBL P<\/b> x = \" + show(xb) + \": P = \" + a.P.toFixed(2) + \" kPa, y = \" + show(a.y) + \"<br>\";\n\n  // (b) DEW P\n  var yd = comp(\"yd1\", \"yd2\");\n  var b = dewP(yd, T);\n  out += \"<b>(b) DEW P<\/b> y = \" + show(yd) + \": P = \" + b.P.toFixed(2) + \" kPa, x = \" + show(b.x) + \"<br>\";\n\n  // (c) P,T-flash at the average pressure\n  var Pf = (a.P + b.P) / 2;\n  var zf = comp(\"zf1\", \"zf2\");\n  var f = flash(zf, T, Pf);\n  out += \"<b>(c) P,T-flash<\/b> (P = \" + Pf.toFixed(2) + \" kPa, z = \" + show(zf) + \"): V = \" + f.V.toFixed(4) +\n         \", x = \" + show(f.x) + \", y = \" + show(f.y);\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.22": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.22 - Wilson equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.22 - Wilson equation: BUBL T, DEW T and P,T-flash at P = 101.33 kPa<\/h1>\n  <p>System: Acetone (1) / Methanol (2) / Water (3), Eq. (10.5) with the Wilson equation<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Pressure P (kPa)<\/label> <input id=\"P\" value=\"101.33\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <p class=\"small\">Wilson parameters from Table 12.5 (1 = acetone, 2 = methanol, 3 = water). Pairs: 1-2 acetone/methanol, 1-3 acetone/water, 2-3 methanol/water.<\/p>\n  <label>V1, V2, V3 (cm3/mol)<\/label> <input id=\"V1\" value=\"74.05\"> <input id=\"V2\" value=\"40.73\"> <input id=\"V3\" value=\"18.07\"><br>\n  <label>a12, a21 (cal/mol)<\/label> <input id=\"a12\" value=\"-161.88\"> <input id=\"a21\" value=\"583.11\"><br>\n  <label>a13, a31 (cal/mol)<\/label> <input id=\"a13\" value=\"291.27\"> <input id=\"a31\" value=\"1448.01\"><br>\n  <label>a23, a32 (cal/mol)<\/label> <input id=\"a23\" value=\"107.38\"> <input id=\"a32\" value=\"469.55\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Acetone A, B, C<\/label>\n  <input id=\"A1\" value=\"14.3145\"> <input id=\"B1\" value=\"2756.22\"> <input id=\"C1\" value=\"228.060\"><br>\n  <label>Methanol A, B, C<\/label>\n  <input id=\"A2\" value=\"16.5785\"> <input id=\"B2\" value=\"3638.27\"> <input id=\"C2\" value=\"239.500\"><br>\n  <label>Water A, B, C<\/label>\n  <input id=\"A3\" value=\"16.3872\"> <input id=\"B3\" value=\"3885.70\"> <input id=\"C3\" value=\"230.170\"><br>\n  <p class=\"small\">Compositions asked in the problem (the third component is 1 - x1 - x2):<\/p>\n  <label>x1, x2 for BUBL (part a)<\/label> <input id=\"xb1\" value=\"0.3\"> <input id=\"xb2\" value=\"0.4\"><br>\n  <label>y1, y2 for DEW (part b)<\/label> <input id=\"yd1\" value=\"0.3\"> <input id=\"yd2\" value=\"0.4\"><br>\n  <label>z1, z2 for flash (part c)<\/label> <input id=\"zf1\" value=\"0.3\"> <input id=\"zf2\" value=\"0.2\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Activity coefficients (Wilson, 3 components).<\/b> &Lambda;<sub>ij<\/sub> = (V<sub>j<\/sub>/V<sub>i<\/sub>) exp(-a<sub>ij<\/sub> / RT), with &Lambda;<sub>ii<\/sub> = 1. Then<br>\n  ln &gamma;<sub>i<\/sub> = 1 - ln( &Sigma;<sub>j<\/sub> x<sub>j<\/sub> &Lambda;<sub>ij<\/sub> ) - &Sigma;<sub>k<\/sub> [ x<sub>k<\/sub> &Lambda;<sub>ki<\/sub> / &Sigma;<sub>j<\/sub> x<sub>j<\/sub> &Lambda;<sub>kj<\/sub> ]<\/p>\n  <p><b>(a) BUBL T.<\/b> x and P are known. Guess T, find Psat and &gamma; at that T, and calculate P = &Sigma; x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub>. Change T by bisection until P equals 101.33 kPa. Then y<sub>i<\/sub> = x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P.<\/p>\n  <p><b>(b) DEW T.<\/b> y and P are known. For a guessed T, find x<sub>i<\/sub> = y<sub>i<\/sub> P / (&gamma;<sub>i<\/sub> Psat<sub>i<\/sub>) by repeating (because &gamma; depends on x). If the sum of x<sub>i<\/sub> is more than 1, T is too low. Adjust T by bisection until the sum is 1.<\/p>\n  <p><b>(c) P,T-flash.<\/b> T is the average of the bubble and dew temperatures. With K<sub>i<\/sub> = &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P, solve the Rachford-Rice equation &Sigma; z<sub>i<\/sub>(K<sub>i<\/sub> - 1) / (1 + V(K<sub>i<\/sub> - 1)) = 0 for the vapor fraction V. Then x<sub>i<\/sub> = z<sub>i<\/sub> / (1 + V(K<sub>i<\/sub> - 1)) and y<sub>i<\/sub> = K<sub>i<\/sub> x<sub>i<\/sub>. Repeat because &gamma; depends on x.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// Antoine equation: Psat in kPa for component i (0, 1, 2), T in Kelvin\nfunction psat(i, T) {\n  var n = i + 1;\n  return Math.exp(get(\"A\" + n) - get(\"B\" + n) / ((T - 273.15) + get(\"C\" + n)));\n}\n\n// make a composition list [x1, x2, x3] from two input boxes (third = 1 - first two)\nfunction comp(id1, id2) {\n  var a = get(id1), b = get(id2);\n  return [a, b, 1 - a - b];\n}\n\n// show a list of numbers as text\nfunction show(v) {\n  return \"(\" + v[0].toFixed(4) + \", \" + v[1].toFixed(4) + \", \" + v[2].toFixed(4) + \")\";\n}\n\n// Wilson equation for 3 components: returns [gamma1, gamma2, gamma3]\nfunction gammas(x, T) {\n  var R = get(\"R\");\n  var V = [get(\"V1\"), get(\"V2\"), get(\"V3\")];\n  var a = [[0, get(\"a12\"), get(\"a13\")], [get(\"a21\"), 0, get(\"a23\")], [get(\"a31\"), get(\"a32\"), 0]];\n  var L = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];\n  for (var i = 0; i < 3; i++) {\n    for (var j = 0; j < 3; j++) {\n      if (i != j) L[i][j] = (V[j] / V[i]) * Math.exp(-a[i][j] / (R * T));\n    }\n  }\n  var S = [0, 0, 0];                       // S[i] = sum over j of x[j] * L[i][j]\n  for (var i = 0; i < 3; i++) {\n    for (var j = 0; j < 3; j++) S[i] += x[j] * L[i][j];\n  }\n  var g = [];\n  for (var i = 0; i < 3; i++) {\n    var sum = 0;\n    for (var k = 0; k < 3; k++) sum += x[k] * L[k][i] / S[k];\n    g.push(Math.exp(1 - Math.log(S[i]) - sum));\n  }\n  return g;\n}\n\n// BUBL P: x and T are known, find P and y\nfunction bubbleP(x, T) {\n  var g = gammas(x, T);\n  var p = [], P = 0;\n  for (var i = 0; i < 3; i++) { p.push(x[i] * g[i] * psat(i, T)); P += p[i]; }\n  return { P: P, y: [p[0] / P, p[1] / P, p[2] / P] };\n}\n\n// DEW P: y and T are known, find P and x (trial and error, repeat many times)\nfunction dewP(y, T) {\n  var x = [y[0], y[1], y[2]], P = 0;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var s = 0;\n    for (var i = 0; i < 3; i++) s += y[i] / (g[i] * psat(i, T));\n    P = 1 / s;\n    for (var i = 0; i < 3; i++) x[i] = y[i] * P / (g[i] * psat(i, T));\n  }\n  return { P: P, x: x };\n}\n\n// P,T-flash: z, T and P are known, find V, x and y\nfunction flash(z, T, P) {\n  var x = [z[0], z[1], z[2]], V = 0.5, K = [1, 1, 1];\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    for (var i = 0; i < 3; i++) K[i] = g[i] * psat(i, T) / P;\n    // Rachford-Rice equation, solved for V by bisection\n    var low = 0, high = 1;\n    for (var m = 0; m < 60; m++) {\n      V = (low + high) / 2;\n      var f = 0;\n      for (var i = 0; i < 3; i++) f += z[i] * (K[i] - 1) / (1 + V * (K[i] - 1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xn = [], s = 0;\n    for (var i = 0; i < 3; i++) { xn.push(z[i] / (1 + V * (K[i] - 1))); s += xn[i]; }\n    for (var i = 0; i < 3; i++) x[i] = xn[i] / s;\n  }\n  var y = [], sy = 0;\n  for (var i = 0; i < 3; i++) { y.push(K[i] * x[i]); sy += y[i]; }\n  return { V: V, x: x, y: [y[0] / sy, y[1] / sy, y[2] / sy] };\n}\n\n// BUBL T: x and P are known, find T by bisection\nfunction bubbleT(x, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y: bubbleP(x, T).y };\n}\n\n// DEW T: y and P are known, find T and x\nfunction dewS(y, T, P) {\n  var x = [y[0], y[1], y[2]], S = 1;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var r = [], S = 0;\n    for (var i = 0; i < 3; i++) { r.push(y[i] * P / (g[i] * psat(i, T))); S += r[i]; }\n    for (var i = 0; i < 3; i++) x[i] = r[i] / S;\n  }\n  return { S: S, x: x };\n}\nfunction dewT(y, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x: dewS(y, T, P).x };\n}\n\nfunction solve() {\n  var P = get(\"P\");\n  var out = \"\";\n  function C(T) { return (T - 273.15).toFixed(2) + \" &deg;C (\" + T.toFixed(2) + \" K)\"; }\n\n  // (a) BUBL T\n  var xb = comp(\"xb1\", \"xb2\");\n  var a = bubbleT(xb, P);\n  out += \"<b>(a) BUBL T<\/b> x = \" + show(xb) + \": T = \" + C(a.T) + \", y = \" + show(a.y) + \"<br>\";\n\n  // (b) DEW T\n  var yd = comp(\"yd1\", \"yd2\");\n  var b = dewT(yd, P);\n  out += \"<b>(b) DEW T<\/b> y = \" + show(yd) + \": T = \" + C(b.T) + \", x = \" + show(b.x) + \"<br>\";\n\n  // (c) P,T-flash at the average temperature\n  var Tf = (a.T + b.T) / 2;\n  var zf = comp(\"zf1\", \"zf2\");\n  var f = flash(zf, Tf, P);\n  out += \"<b>(c) P,T-flash<\/b> (T = \" + C(Tf) + \", z = \" + show(zf) + \"): V = \" + f.V.toFixed(4) +\n         \", x = \" + show(f.x) + \", y = \" + show(f.y);\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "12.23": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 12.23 - NRTL equation<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 220px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 12.23 - NRTL equation: BUBL T, DEW T and P,T-flash at P = 101.33 kPa<\/h1>\n  <p>System: Acetone (1) / Methanol (2) / Water (3), Eq. (10.5) with the NRTL equation<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data (Table 12.5)<\/h2>\n  <label>Pressure P (kPa)<\/label> <input id=\"P\" value=\"101.33\"><br>\n  <label>R (cal/mol K)<\/label> <input id=\"R\" value=\"1.987\"><br>\n  <p class=\"small\">NRTL parameters from Table 12.5 (1 = acetone, 2 = methanol, 3 = water). Pairs: 1-2 acetone/methanol, 1-3 acetone/water, 2-3 methanol/water.<\/p>\n  <label>b12, b21 (cal/mol)<\/label> <input id=\"b12\" value=\"184.70\"> <input id=\"b21\" value=\"222.64\"><br>\n  <label>b13, b31 (cal/mol)<\/label> <input id=\"b13\" value=\"631.05\"> <input id=\"b31\" value=\"1197.41\"><br>\n  <label>b23, b32 (cal/mol)<\/label> <input id=\"b23\" value=\"-253.88\"> <input id=\"b32\" value=\"845.21\"><br>\n  <label>alpha12, alpha13, alpha23<\/label> <input id=\"al12\" value=\"0.3084\"> <input id=\"al13\" value=\"0.5343\"> <input id=\"al23\" value=\"0.2994\"><br>\n  <p class=\"small\">Antoine: ln Psat (kPa) = A - B / (t + C), t in &deg;C (check with Table B.2 of the book)<\/p>\n  <label>Acetone A, B, C<\/label>\n  <input id=\"A1\" value=\"14.3145\"> <input id=\"B1\" value=\"2756.22\"> <input id=\"C1\" value=\"228.060\"><br>\n  <label>Methanol A, B, C<\/label>\n  <input id=\"A2\" value=\"16.5785\"> <input id=\"B2\" value=\"3638.27\"> <input id=\"C2\" value=\"239.500\"><br>\n  <label>Water A, B, C<\/label>\n  <input id=\"A3\" value=\"16.3872\"> <input id=\"B3\" value=\"3885.70\"> <input id=\"C3\" value=\"230.170\"><br>\n  <p class=\"small\">Compositions asked in the problem (the third component is 1 - x1 - x2):<\/p>\n  <label>x1, x2 for BUBL (part a)<\/label> <input id=\"xb1\" value=\"0.3\"> <input id=\"xb2\" value=\"0.4\"><br>\n  <label>y1, y2 for DEW (part b)<\/label> <input id=\"yd1\" value=\"0.3\"> <input id=\"yd2\" value=\"0.4\"><br>\n  <label>z1, z2 for flash (part c)<\/label> <input id=\"zf1\" value=\"0.3\"> <input id=\"zf2\" value=\"0.2\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Activity coefficients (NRTL, 3 components).<\/b> &tau;<sub>ij<\/sub> = b<sub>ij<\/sub> / RT, G<sub>ij<\/sub> = exp(-&alpha;<sub>ij<\/sub> &tau;<sub>ij<\/sub>), with &alpha;<sub>ij<\/sub> = &alpha;<sub>ji<\/sub>. Then<br>\n  ln &gamma;<sub>i<\/sub> = &Sigma;<sub>j<\/sub> x<sub>j<\/sub> &tau;<sub>ji<\/sub> G<sub>ji<\/sub> / &Sigma;<sub>k<\/sub> x<sub>k<\/sub> G<sub>ki<\/sub> + &Sigma;<sub>j<\/sub> [ x<sub>j<\/sub> G<sub>ij<\/sub> / &Sigma;<sub>k<\/sub> x<sub>k<\/sub> G<sub>kj<\/sub> ] ( &tau;<sub>ij<\/sub> - &Sigma;<sub>m<\/sub> x<sub>m<\/sub> &tau;<sub>mj<\/sub> G<sub>mj<\/sub> / &Sigma;<sub>k<\/sub> x<sub>k<\/sub> G<sub>kj<\/sub> )<\/p>\n  <p><b>(a) BUBL T.<\/b> x and P are known. Guess T, find Psat and &gamma; at that T, and calculate P = &Sigma; x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub>. Change T by bisection until P equals 101.33 kPa. Then y<sub>i<\/sub> = x<sub>i<\/sub> &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P.<\/p>\n  <p><b>(b) DEW T.<\/b> y and P are known. For a guessed T, find x<sub>i<\/sub> = y<sub>i<\/sub> P / (&gamma;<sub>i<\/sub> Psat<sub>i<\/sub>) by repeating (because &gamma; depends on x). If the sum of x<sub>i<\/sub> is more than 1, T is too low. Adjust T by bisection until the sum is 1.<\/p>\n  <p><b>(c) P,T-flash.<\/b> T is the average of the bubble and dew temperatures. With K<sub>i<\/sub> = &gamma;<sub>i<\/sub> Psat<sub>i<\/sub> / P, solve the Rachford-Rice equation &Sigma; z<sub>i<\/sub>(K<sub>i<\/sub> - 1) / (1 + V(K<sub>i<\/sub> - 1)) = 0 for the vapor fraction V. Then x<sub>i<\/sub> = z<sub>i<\/sub> / (1 + V(K<sub>i<\/sub> - 1)) and y<sub>i<\/sub> = K<sub>i<\/sub> x<sub>i<\/sub>. Repeat because &gamma; depends on x.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\n// Antoine equation: Psat in kPa for component i (0, 1, 2), T in Kelvin\nfunction psat(i, T) {\n  var n = i + 1;\n  return Math.exp(get(\"A\" + n) - get(\"B\" + n) / ((T - 273.15) + get(\"C\" + n)));\n}\n\n// make a composition list [x1, x2, x3] from two input boxes (third = 1 - first two)\nfunction comp(id1, id2) {\n  var a = get(id1), b = get(id2);\n  return [a, b, 1 - a - b];\n}\n\n// show a list of numbers as text\nfunction show(v) {\n  return \"(\" + v[0].toFixed(4) + \", \" + v[1].toFixed(4) + \", \" + v[2].toFixed(4) + \")\";\n}\n\n// NRTL equation for 3 components: returns [gamma1, gamma2, gamma3]\nfunction gammas(x, T) {\n  var R = get(\"R\");\n  var b = [[0, get(\"b12\"), get(\"b13\")], [get(\"b21\"), 0, get(\"b23\")], [get(\"b31\"), get(\"b32\"), 0]];\n  var al = [[0, get(\"al12\"), get(\"al13\")], [get(\"al12\"), 0, get(\"al23\")], [get(\"al13\"), get(\"al23\"), 0]];\n  var tau = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];\n  var G = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];\n  for (var i = 0; i < 3; i++) {\n    for (var j = 0; j < 3; j++) {\n      if (i != j) {\n        tau[i][j] = b[i][j] / (R * T);\n        G[i][j] = Math.exp(-al[i][j] * tau[i][j]);\n      }\n    }\n  }\n  var S = [0, 0, 0];                       // S[j] = sum over k of x[k] * G[k][j]\n  var C = [0, 0, 0];                       // C[j] = sum over m of x[m] * tau[m][j] * G[m][j]\n  for (var j = 0; j < 3; j++) {\n    for (var k = 0; k < 3; k++) {\n      S[j] += x[k] * G[k][j];\n      C[j] += x[k] * tau[k][j] * G[k][j];\n    }\n  }\n  var g = [];\n  for (var i = 0; i < 3; i++) {\n    var term1 = C[i] / S[i];\n    var term2 = 0;\n    for (var j = 0; j < 3; j++) {\n      term2 += (x[j] * G[i][j] / S[j]) * (tau[i][j] - C[j] / S[j]);\n    }\n    g.push(Math.exp(term1 + term2));\n  }\n  return g;\n}\n\n// BUBL P: x and T are known, find P and y\nfunction bubbleP(x, T) {\n  var g = gammas(x, T);\n  var p = [], P = 0;\n  for (var i = 0; i < 3; i++) { p.push(x[i] * g[i] * psat(i, T)); P += p[i]; }\n  return { P: P, y: [p[0] / P, p[1] / P, p[2] / P] };\n}\n\n// DEW P: y and T are known, find P and x (trial and error, repeat many times)\nfunction dewP(y, T) {\n  var x = [y[0], y[1], y[2]], P = 0;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var s = 0;\n    for (var i = 0; i < 3; i++) s += y[i] / (g[i] * psat(i, T));\n    P = 1 / s;\n    for (var i = 0; i < 3; i++) x[i] = y[i] * P / (g[i] * psat(i, T));\n  }\n  return { P: P, x: x };\n}\n\n// P,T-flash: z, T and P are known, find V, x and y\nfunction flash(z, T, P) {\n  var x = [z[0], z[1], z[2]], V = 0.5, K = [1, 1, 1];\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    for (var i = 0; i < 3; i++) K[i] = g[i] * psat(i, T) / P;\n    // Rachford-Rice equation, solved for V by bisection\n    var low = 0, high = 1;\n    for (var m = 0; m < 60; m++) {\n      V = (low + high) / 2;\n      var f = 0;\n      for (var i = 0; i < 3; i++) f += z[i] * (K[i] - 1) / (1 + V * (K[i] - 1));\n      if (f > 0) low = V; else high = V;\n    }\n    var xn = [], s = 0;\n    for (var i = 0; i < 3; i++) { xn.push(z[i] / (1 + V * (K[i] - 1))); s += xn[i]; }\n    for (var i = 0; i < 3; i++) x[i] = xn[i] / s;\n  }\n  var y = [], sy = 0;\n  for (var i = 0; i < 3; i++) { y.push(K[i] * x[i]); sy += y[i]; }\n  return { V: V, x: x, y: [y[0] / sy, y[1] / sy, y[2] / sy] };\n}\n\n// BUBL T: x and P are known, find T by bisection\nfunction bubbleT(x, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (bubbleP(x, mid).P < P) low = mid; else high = mid;\n  }\n  var T = (low + high) / 2;\n  return { T: T, y: bubbleP(x, T).y };\n}\n\n// DEW T: y and P are known, find T and x\nfunction dewS(y, T, P) {\n  var x = [y[0], y[1], y[2]], S = 1;\n  for (var n = 0; n < 500; n++) {\n    var g = gammas(x, T);\n    var r = [], S = 0;\n    for (var i = 0; i < 3; i++) { r.push(y[i] * P / (g[i] * psat(i, T))); S += r[i]; }\n    for (var i = 0; i < 3; i++) x[i] = r[i] / S;\n  }\n  return { S: S, x: x };\n}\nfunction dewT(y, P) {\n  var low = 280, high = 420;\n  for (var n = 0; n < 60; n++) {\n    var mid = (low + high) / 2;\n    if (dewS(y, mid, P).S > 1) low = mid; else high = mid;   // S > 1 means T is too low\n  }\n  var T = (low + high) / 2;\n  return { T: T, x: dewS(y, T, P).x };\n}\n\nfunction solve() {\n  var P = get(\"P\");\n  var out = \"\";\n  function C(T) { return (T - 273.15).toFixed(2) + \" &deg;C (\" + T.toFixed(2) + \" K)\"; }\n\n  // (a) BUBL T\n  var xb = comp(\"xb1\", \"xb2\");\n  var a = bubbleT(xb, P);\n  out += \"<b>(a) BUBL T<\/b> x = \" + show(xb) + \": T = \" + C(a.T) + \", y = \" + show(a.y) + \"<br>\";\n\n  // (b) DEW T\n  var yd = comp(\"yd1\", \"yd2\");\n  var b = dewT(yd, P);\n  out += \"<b>(b) DEW T<\/b> y = \" + show(yd) + \": T = \" + C(b.T) + \", x = \" + show(b.x) + \"<br>\";\n\n  // (c) P,T-flash at the average temperature\n  var Tf = (a.T + b.T) / 2;\n  var zf = comp(\"zf1\", \"zf2\");\n  var f = flash(zf, Tf, P);\n  out += \"<b>(c) P,T-flash<\/b> (T = \" + C(Tf) + \", z = \" + show(zf) + \"): V = \" + f.V.toFixed(4) +\n         \", x = \" + show(f.x) + \", y = \" + show(f.y);\n  document.getElementById(\"answers\").innerHTML = out;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "13.14": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 13.14 - Equilibrium composition<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 230px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 13.14 - Equilibrium composition of the styrene hydrogenation reaction<\/h1>\n  <p>C<sub>6<\/sub>H<sub>5<\/sub>CHCH<sub>2<\/sub>(g) + H<sub>2<\/sub>(g) &rarr; C<sub>6<\/sub>H<sub>5<\/sub>C<sub>2<\/sub>H<sub>5<\/sub>(g) &nbsp; at 650 &deg;C and atmospheric pressure, initial H<sub>2<\/sub> : styrene = 1.5 : 1<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data<\/h2>\n  <label>Temperature (&deg;C)<\/label> <input id=\"tc\" value=\"650\"><br>\n  <label>Pressure (bar)<\/label> <input id=\"P\" value=\"1.01325\"> <span class=\"small\">(1 atm; use 1 if your book says 1 bar)<\/span><br>\n  <label>Moles H2 per mole styrene<\/label> <input id=\"ratio\" value=\"1.5\"><br>\n  <label>R (J/mol K)<\/label> <input id=\"R\" value=\"8.314\"><br>\n  <p class=\"small\">Species data (Table C.1 and C.4): Cp/R = A + B T + C T<sup>2<\/sup> + D T<sup>-2<\/sup>. Enter B in 10<sup>-3<\/sup>, C in 10<sup>-6<\/sup>, D in 10<sup>5<\/sup>.<\/p>\n  <table>\n    <tr><th>Species<\/th><th>A<\/th><th>B x 10<sup>3<\/sup><\/th><th>C x 10<sup>6<\/sup><\/th><th>D x 10<sup>-5<\/sup><\/th><th>&Delta;Hf 298 (J/mol)<\/th><th>&Delta;Gf 298 (J/mol)<\/th><\/tr>\n    <tr><td>Styrene<\/td>\n        <td><input id=\"As\" value=\"2.050\"><\/td><td><input id=\"Bs\" value=\"50.192\"><\/td><td><input id=\"Cs\" value=\"-16.662\"><\/td><td><input id=\"Ds\" value=\"0\"><\/td>\n        <td><input id=\"Hs\" value=\"147360\"><\/td><td><input id=\"Gs\" value=\"213900\"><\/td><\/tr>\n    <tr><td>Hydrogen<\/td>\n        <td><input id=\"Ah\" value=\"3.249\"><\/td><td><input id=\"Bh\" value=\"0.422\"><\/td><td><input id=\"Ch\" value=\"0\"><\/td><td><input id=\"Dh\" value=\"0.083\"><\/td>\n        <td><input id=\"Hh\" value=\"0\"><\/td><td><input id=\"Gh\" value=\"0\"><\/td><\/tr>\n    <tr><td>Ethylbenzene<\/td>\n        <td><input id=\"Ae\" value=\"1.124\"><\/td><td><input id=\"Be\" value=\"55.380\"><\/td><td><input id=\"Ce\" value=\"-18.476\"><\/td><td><input id=\"De\" value=\"0\"><\/td>\n        <td><input id=\"He\" value=\"29920\"><\/td><td><input id=\"Ge\" value=\"130890\"><\/td><\/tr>\n  <\/table>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Step 1.<\/b> Find the standard changes at 298 K (products minus reactants):<br>\n     &Delta;H&deg;298 = &Delta;Hf(ethylbenzene) - &Delta;Hf(styrene) - &Delta;Hf(H<sub>2<\/sub>), and the same for &Delta;G&deg;298.<\/p>\n  <p><b>Step 2.<\/b> Find &Delta;A, &Delta;B, &Delta;C, &Delta;D (products minus reactants) for the heat capacity change &Delta;Cp/R = &Delta;A + &Delta;B T + &Delta;C T<sup>2<\/sup> + &Delta;D T<sup>-2<\/sup>.<\/p>\n  <p><b>Step 3.<\/b> Move the equilibrium constant from 298 K to T. The van 't Hoff equation with a changing &Delta;H gives<br>\n     &Delta;G&deg;/RT = (&Delta;G&deg;298 - &Delta;H&deg;298) / (R T0) + &Delta;H&deg;298 / (R T) + (1/T) &int; (&Delta;Cp/R) dT - &int; (&Delta;Cp/R) dT / T &nbsp; (both integrals from T0 = 298.15 K to T)<br>\n     and then K = exp( -&Delta;G&deg;/RT ).<\/p>\n  <p><b>Step 4.<\/b> Mole balance on a basis of 1 mol styrene, with &epsilon; = extent of reaction:<br>\n     styrene = 1 - &epsilon;, H<sub>2<\/sub> = 1.5 - &epsilon;, ethylbenzene = &epsilon;, total = 2.5 - &epsilon;<\/p>\n  <p><b>Step 5.<\/b> For ideal gases: K = [ y<sub>EB<\/sub> / (y<sub>S<\/sub> y<sub>H2<\/sub>) ] (P&deg; / P), with P&deg; = 1 bar. Put the mole fractions in terms of &epsilon; and solve for &epsilon; (bisection in the code).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\nfunction solve() {\n  var R = get(\"R\");\n  var T = get(\"tc\") + 273.15;\n  var T0 = 298.15;\n  var P = get(\"P\");          // bar\n  var ratio = get(\"ratio\");  // mol H2 per mol styrene\n\n  // Step 1: standard changes at 298 K (J/mol)\n  var dH0 = get(\"He\") - get(\"Hs\") - get(\"Hh\");\n  var dG0 = get(\"Ge\") - get(\"Gs\") - get(\"Gh\");\n\n  // Step 2: change in Cp constants (products - reactants)\n  var dA = get(\"Ae\") - get(\"As\") - get(\"Ah\");\n  var dB = (get(\"Be\") - get(\"Bs\") - get(\"Bh\")) * 1e-3;\n  var dC = (get(\"Ce\") - get(\"Cs\") - get(\"Ch\")) * 1e-6;\n  var dD = (get(\"De\") - get(\"Ds\") - get(\"Dh\")) * 1e5;\n\n  // Step 3: integrals of dCp/R from T0 to T\n  // integral of dCp/R dT\n  var I1 = dA * (T - T0) + dB / 2 * (T * T - T0 * T0) + dC / 3 * (Math.pow(T, 3) - Math.pow(T0, 3)) - dD * (1 / T - 1 / T0);\n  // integral of dCp/R dT / T\n  var I2 = dA * Math.log(T / T0) + dB * (T - T0) + dC / 2 * (T * T - T0 * T0) - dD / 2 * (1 / (T * T) - 1 / (T0 * T0));\n\n  var dGoverRT = (dG0 - dH0) / (R * T0) + dH0 / (R * T) + I1 / T - I2;\n  var K = Math.exp(-dGoverRT);\n  var dGT = dGoverRT * R * T;     // standard Gibbs energy change at T\n\n  // Step 5: solve for extent of reaction e (basis 1 mol styrene)\n  // function of e: K_calc(e) - K, increasing between 0 and 1\n  function Kcalc(e) {\n    var ny = 1 - e, nh = ratio - e, ne = e, nt = 1 + ratio - e;\n    return (ne / nt) / ((ny / nt) * (nh / nt)) * (1 / P);\n  }\n  var lo = 0, hi = Math.min(1, ratio) - 1e-12;\n  for (var n = 0; n < 200; n++) {\n    var mid = (lo + hi) / 2;\n    if (Kcalc(mid) < K) lo = mid; else hi = mid;\n  }\n  var e = (lo + hi) / 2;\n\n  var nS = 1 - e, nH = ratio - e, nE = e, nT = 1 + ratio - e;\n\n  document.getElementById(\"answers\").innerHTML =\n    \"&Delta;H&deg;298 = \" + dH0.toFixed(0) + \" J/mol, &Delta;G&deg;298 = \" + dG0.toFixed(0) + \" J/mol<br>\" +\n    \"&Delta;A = \" + dA.toFixed(3) + \", &Delta;B = \" + dB.toExponential(3) + \", &Delta;C = \" + dC.toExponential(3) + \", &Delta;D = \" + dD.toExponential(3) + \"<br>\" +\n    \"At T = \" + T.toFixed(2) + \" K: &Delta;G&deg; = \" + dGT.toFixed(0) + \" J/mol, K = \" + K.toFixed(4) + \"<br>\" +\n    \"Extent of reaction &epsilon; = \" + e.toFixed(4) + \" mol per mol styrene (styrene conversion = \" + (e * 100).toFixed(2) + \" %)\";\n\n  document.getElementById(\"table\").innerHTML =\n    \"<tr><th>Species<\/th><th>Moles<\/th><th>Mole fraction<\/th><\/tr>\" +\n    \"<tr><td>Styrene<\/td><td>\" + nS.toFixed(4) + \"<\/td><td>\" + (nS / nT).toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>Hydrogen<\/td><td>\" + nH.toFixed(4) + \"<\/td><td>\" + (nH / nT).toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>Ethylbenzene<\/td><td>\" + nE.toFixed(4) + \"<\/td><td>\" + (nE / nT).toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td><b>Total<\/b><\/td><td>\" + nT.toFixed(4) + \"<\/td><td>1.0000<\/td><\/tr>\";\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "13.18": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 13.18 - 1,3-Butadiene production<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 230px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 13.18 - Production of 1,3-butadiene with steam<\/h1>\n  <p>C<sub>2<\/sub>H<sub>5<\/sub>CHCH<sub>2<\/sub>(g) &rarr; CH<sub>2<\/sub>CHCHCH<sub>2<\/sub>(g) + H<sub>2<\/sub>(g) &nbsp; at 950 K and 1 bar. Product gas contains 10 mol % 1,3-butadiene. Find (a) the mole fractions of the other species in the product and (b) the mole fraction of steam in the feed.<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data<\/h2>\n  <label>Temperature T (K)<\/label> <input id=\"T\" value=\"950\"><br>\n  <label>Pressure P (bar)<\/label> <input id=\"P\" value=\"1\"><br>\n  <label>Mole fraction of butadiene<\/label> <input id=\"ybd\" value=\"0.10\"><br>\n  <label>R (J/mol K)<\/label> <input id=\"R\" value=\"8.314\"><br>\n  <p class=\"small\">Species data: Cp/R = A + B T + C T<sup>2<\/sup> + D T<sup>-2<\/sup>. Enter B in 10<sup>-3<\/sup>, C in 10<sup>-6<\/sup>, D in 10<sup>5<\/sup>. Check &Delta;G and &Delta;H values against Table C.4 of your book.<\/p>\n  <table>\n    <tr><th>Species<\/th><th>A<\/th><th>B x 10<sup>3<\/sup><\/th><th>C x 10<sup>6<\/sup><\/th><th>D x 10<sup>-5<\/sup><\/th><th>&Delta;Hf 298 (J/mol)<\/th><th>&Delta;Gf 298 (J/mol)<\/th><\/tr>\n    <tr><td>1-Butene<\/td>\n        <td><input id=\"Ab\" value=\"1.967\"><\/td><td><input id=\"Bb\" value=\"31.630\"><\/td><td><input id=\"Cb\" value=\"-9.873\"><\/td><td><input id=\"Db\" value=\"0\"><\/td>\n        <td><input id=\"Hb\" value=\"-540\"><\/td><td><input id=\"Gb\" value=\"70340\"><\/td><\/tr>\n    <tr><td>1,3-Butadiene<\/td>\n        <td><input id=\"Ad\" value=\"2.734\"><\/td><td><input id=\"Bd\" value=\"26.786\"><\/td><td><input id=\"Cd\" value=\"-8.882\"><\/td><td><input id=\"Dd\" value=\"0\"><\/td>\n        <td><input id=\"Hd\" value=\"109240\"><\/td><td><input id=\"Gd\" value=\"149795\"><\/td><\/tr>\n    <tr><td>Hydrogen<\/td>\n        <td><input id=\"Ah\" value=\"3.249\"><\/td><td><input id=\"Bh\" value=\"0.422\"><\/td><td><input id=\"Ch\" value=\"0\"><\/td><td><input id=\"Dh\" value=\"0.083\"><\/td>\n        <td><input id=\"Hh\" value=\"0\"><\/td><td><input id=\"Gh\" value=\"0\"><\/td><\/tr>\n  <\/table>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Step 1.<\/b> Standard changes at 298 K (products minus reactants): &Delta;H&deg;298 = &Delta;Hf(butadiene) + &Delta;Hf(H<sub>2<\/sub>) - &Delta;Hf(1-butene), and the same for &Delta;G&deg;298.<\/p>\n  <p><b>Step 2.<\/b> &Delta;A, &Delta;B, &Delta;C, &Delta;D (products minus reactants) give &Delta;Cp/R = &Delta;A + &Delta;B T + &Delta;C T<sup>2<\/sup> + &Delta;D T<sup>-2<\/sup>.<\/p>\n  <p><b>Step 3.<\/b> Equilibrium constant at T (van 't Hoff with changing &Delta;H):<br>\n     &Delta;G&deg;/RT = (&Delta;G&deg;298 - &Delta;H&deg;298) / (R T0) + &Delta;H&deg;298 / (R T) + (1/T) &int; (&Delta;Cp/R) dT - &int; (&Delta;Cp/R) dT / T &nbsp; (T0 = 298.15 K), then K = exp( -&Delta;G&deg;/RT ).<\/p>\n  <p><b>Step 4.<\/b> Steam is inert. For ideal gases at equilibrium, K = y<sub>BD<\/sub> y<sub>H2<\/sub> P / ( y<sub>B<\/sub> P&deg; ) with P&deg; = 1 bar.<\/p>\n  <p><b>Step 5 (part a).<\/b> One mole of H<sub>2<\/sub> forms for each mole of butadiene, so y<sub>H2<\/sub> = y<sub>BD<\/sub> = 0.10. Then y<sub>B<\/sub> (1-butene) = y<sub>BD<\/sub><sup>2<\/sup> P / (K P&deg;), and y<sub>steam<\/sub> = 1 - y<sub>BD<\/sub> - y<sub>H2<\/sub> - y<sub>B<\/sub>.<\/p>\n  <p><b>Step 6 (part b).<\/b> Basis 1 mol 1-butene fed with s mol steam. If &epsilon; mol react, the product has (1 - &epsilon;) butene, &epsilon; butadiene, &epsilon; H<sub>2<\/sub>, s steam, total n = 1 + s + &epsilon;. From y<sub>BD<\/sub> = &epsilon;/n and y<sub>B<\/sub> = (1 - &epsilon;)/n we get n = 1 / (y<sub>B<\/sub> + y<sub>BD<\/sub>), &epsilon; = y<sub>BD<\/sub> n and s = n - 1 - &epsilon;. The steam mole fraction in the feed is s / (1 + s).<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\nfunction solve() {\n  var R = get(\"R\");\n  var T = get(\"T\");\n  var T0 = 298.15;\n  var P = get(\"P\");\n  var ybd = get(\"ybd\");\n\n  // Step 1: standard changes at 298 K (J/mol), reaction: butene -> butadiene + H2\n  var dH0 = get(\"Hd\") + get(\"Hh\") - get(\"Hb\");\n  var dG0 = get(\"Gd\") + get(\"Gh\") - get(\"Gb\");\n\n  // Step 2: change in Cp constants (products - reactants)\n  var dA = get(\"Ad\") + get(\"Ah\") - get(\"Ab\");\n  var dB = (get(\"Bd\") + get(\"Bh\") - get(\"Bb\")) * 1e-3;\n  var dC = (get(\"Cd\") + get(\"Ch\") - get(\"Cb\")) * 1e-6;\n  var dD = (get(\"Dd\") + get(\"Dh\") - get(\"Db\")) * 1e5;\n\n  // Step 3: integrals of dCp/R from T0 to T\n  var I1 = dA * (T - T0) + dB / 2 * (T * T - T0 * T0) + dC / 3 * (Math.pow(T, 3) - Math.pow(T0, 3)) - dD * (1 / T - 1 / T0);\n  var I2 = dA * Math.log(T / T0) + dB * (T - T0) + dC / 2 * (T * T - T0 * T0) - dD / 2 * (1 / (T * T) - 1 / (T0 * T0));\n  var dGoverRT = (dG0 - dH0) / (R * T0) + dH0 / (R * T) + I1 / T - I2;\n  var K = Math.exp(-dGoverRT);\n\n  // Step 5: mole fractions in the product gas\n  var yH2 = ybd;                          // H2 and butadiene are formed in equal amounts\n  var yB = ybd * yH2 * P / K;             // from K = yBD * yH2 * P / yB\n  var yS = 1 - ybd - yH2 - yB;            // the rest is steam\n\n  // Step 6: feed composition (basis 1 mol 1-butene)\n  var n = 1 / (yB + ybd);                 // total moles of product\n  var e = ybd * n;                        // moles of butene reacted\n  var s = n - 1 - e;                      // moles of steam\n  var yFeed = s / (1 + s);\n\n  document.getElementById(\"answers\").innerHTML =\n    \"&Delta;H&deg;298 = \" + dH0.toFixed(0) + \" J/mol, &Delta;G&deg;298 = \" + dG0.toFixed(0) + \" J/mol<br>\" +\n    \"&Delta;A = \" + dA.toFixed(3) + \", &Delta;B = \" + dB.toExponential(3) + \", &Delta;C = \" + dC.toExponential(3) + \", &Delta;D = \" + dD.toExponential(3) + \"<br>\" +\n    \"At T = \" + T + \" K: &Delta;G&deg; = \" + (dGoverRT * R * T).toFixed(0) + \" J/mol, K = \" + K.toFixed(5) + \"<br>\" +\n    \"<b>(a)<\/b> Product gas: y(1-butene) = \" + yB.toFixed(4) + \", y(H2) = \" + yH2.toFixed(4) + \", y(steam) = \" + yS.toFixed(4) + \"<br>\" +\n    \"<b>(b)<\/b> Mole fraction of steam in the feed = \" + yFeed.toFixed(4) + \" (\" + s.toFixed(3) + \" mol steam per mol 1-butene)\";\n\n  document.getElementById(\"table\").innerHTML =\n    \"<tr><th>Species<\/th><th>Feed (moles)<\/th><th>Product (moles)<\/th><th>Product mole fraction<\/th><\/tr>\" +\n    \"<tr><td>1-Butene<\/td><td>1.0000<\/td><td>\" + (1 - e).toFixed(4) + \"<\/td><td>\" + yB.toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>1,3-Butadiene<\/td><td>0<\/td><td>\" + e.toFixed(4) + \"<\/td><td>\" + ybd.toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>Hydrogen<\/td><td>0<\/td><td>\" + e.toFixed(4) + \"<\/td><td>\" + yH2.toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>Steam<\/td><td>\" + s.toFixed(4) + \"<\/td><td>\" + s.toFixed(4) + \"<\/td><td>\" + yS.toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td><b>Total<\/b><\/td><td>\" + (1 + s).toFixed(4) + \"<\/td><td>\" + n.toFixed(4) + \"<\/td><td>1.0000<\/td><\/tr>\";\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "13.20": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 13.20 - Ammonia synthesis equilibrium<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 230px; margin: 4px 0; font-size: 14px; }\n  input { width: 80px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 13.20 - Ammonia synthesis: N<sub>2<\/sub> + 3 H<sub>2<\/sub> &rarr; 2 NH<sub>3<\/sub><\/h1>\n  <p>Stoichiometric feed of H<sub>2<\/sub> and N<sub>2<\/sub>. (a) y(NH<sub>3<\/sub>) at 1 bar and 300 K. (b) T for y(NH<sub>3<\/sub>) = 0.5 at 1 bar. (c) T for y(NH<sub>3<\/sub>) = 0.5 at 100 bar, ideal gas. (d) T for y(NH<sub>3<\/sub>) = 0.5 at 100 bar, ideal solution of real gases.<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data<\/h2>\n  <label>R (J/mol K)<\/label> <input id=\"R\" value=\"8.314\"><br>\n  <label>Moles H2 per mole N2 in feed<\/label> <input id=\"r\" value=\"3\"><br>\n  <label>Target y(NH3)<\/label> <input id=\"ytar\" value=\"0.5\"><br>\n  <label>Pressure for (a), (b) (bar)<\/label> <input id=\"P1\" value=\"1\"><br>\n  <label>Pressure for (c), (d) (bar)<\/label> <input id=\"P2\" value=\"100\"><br>\n  <p class=\"small\">Cp/R = A + B T + D T<sup>-2<\/sup> (Table C.1; B in 10<sup>-3<\/sup>, D in 10<sup>5<\/sup>). &Delta;Hf, &Delta;Gf from Table C.4. Tc, Pc, &omega; from Table B.1 (needed only for part d). Check these against your book.<\/p>\n  <table>\n    <tr><th>Species<\/th><th>A<\/th><th>B x 10<sup>3<\/sup><\/th><th>D x 10<sup>-5<\/sup><\/th><th>&Delta;Hf 298<\/th><th>&Delta;Gf 298<\/th><th>Tc (K)<\/th><th>Pc (bar)<\/th><th>&omega;<\/th><\/tr>\n    <tr><td>N<sub>2<\/sub><\/td><td><input id=\"A0\" value=\"3.280\"><\/td><td><input id=\"B0\" value=\"0.593\"><\/td><td><input id=\"D0\" value=\"0.040\"><\/td>\n        <td><input id=\"H0\" value=\"0\"><\/td><td><input id=\"G0\" value=\"0\"><\/td><td><input id=\"Tc0\" value=\"126.2\"><\/td><td><input id=\"Pc0\" value=\"34.00\"><\/td><td><input id=\"w0\" value=\"0.038\"><\/td><\/tr>\n    <tr><td>H<sub>2<\/sub><\/td><td><input id=\"A1\" value=\"3.249\"><\/td><td><input id=\"B1\" value=\"0.422\"><\/td><td><input id=\"D1\" value=\"0.083\"><\/td>\n        <td><input id=\"H1\" value=\"0\"><\/td><td><input id=\"G1\" value=\"0\"><\/td><td><input id=\"Tc1\" value=\"33.19\"><\/td><td><input id=\"Pc1\" value=\"13.13\"><\/td><td><input id=\"w1\" value=\"-0.216\"><\/td><\/tr>\n    <tr><td>NH<sub>3<\/sub><\/td><td><input id=\"A2\" value=\"3.578\"><\/td><td><input id=\"B2\" value=\"3.020\"><\/td><td><input id=\"D2\" value=\"-0.186\"><\/td>\n        <td><input id=\"H2\" value=\"-46110\"><\/td><td><input id=\"G2\" value=\"-16450\"><\/td><td><input id=\"Tc2\" value=\"405.7\"><\/td><td><input id=\"Pc2\" value=\"112.8\"><\/td><td><input id=\"w2\" value=\"0.253\"><\/td><\/tr>\n  <\/table>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Step 1.<\/b> Reaction N<sub>2<\/sub> + 3 H<sub>2<\/sub> &rarr; 2 NH<sub>3<\/sub>. Stoichiometric numbers: &nu;(N<sub>2<\/sub>) = -1, &nu;(H<sub>2<\/sub>) = -3, &nu;(NH<sub>3<\/sub>) = +2. Then &Delta;H&deg;298 = &Sigma; &nu;<sub>i<\/sub> &Delta;Hf<sub>i<\/sub>, &Delta;G&deg;298 = &Sigma; &nu;<sub>i<\/sub> &Delta;Gf<sub>i<\/sub>, and &Delta;A, &Delta;B, &Delta;D are found the same way from the Cp constants.<\/p>\n  <p><b>Step 2.<\/b> Equilibrium constant at any T (van 't Hoff with changing &Delta;H):<br>\n     &Delta;G&deg;/RT = (&Delta;G&deg;298 - &Delta;H&deg;298) / (R T0) + &Delta;H&deg;298 / (R T) + (1/T) &int; (&Delta;Cp/R) dT - &int; (&Delta;Cp/R) dT / T &nbsp; (from T0 = 298.15 K to T), K = exp( -&Delta;G&deg;/RT ).<\/p>\n  <p><b>Step 3.<\/b> Mole balance for 1 mol N<sub>2<\/sub> and r mol H<sub>2<\/sub> fed, extent &epsilon;: N<sub>2<\/sub> = 1 - &epsilon;, H<sub>2<\/sub> = r - 3&epsilon;, NH<sub>3<\/sub> = 2&epsilon;, total = 1 + r - 2&epsilon;.<\/p>\n  <p><b>Step 4 (ideal gas).<\/b> K = [ y(NH<sub>3<\/sub>)<sup>2<\/sup> / ( y(N<sub>2<\/sub>) y(H<sub>2<\/sub>)<sup>3<\/sup> ) ] (P&deg;/P)<sup>2<\/sup>, with P&deg; = 1 bar.<br>\n     (a) Solve for &epsilon; at 300 K and 1 bar. (b), (c) For y(NH<sub>3<\/sub>) = 0.5 the mole fractions are known, so the required K is known, and we search T (bisection) until K(T) equals it.<\/p>\n  <p><b>Step 5 (part d, ideal solution of real gases).<\/b> Now f&#770;<sub>i<\/sub> = y<sub>i<\/sub> &phi;<sub>i<\/sub> P, where &phi;<sub>i<\/sub> is the fugacity coefficient of pure i at T and P:<br>\n     K = [ y(NH<sub>3<\/sub>)<sup>2<\/sup> / ( y(N<sub>2<\/sub>) y(H<sub>2<\/sub>)<sup>3<\/sup> ) ] [ &phi;(NH<sub>3<\/sub>)<sup>2<\/sup> / ( &phi;(N<sub>2<\/sub>) &phi;(H<sub>2<\/sub>)<sup>3<\/sup> ) ] (P&deg;/P)<sup>2<\/sup><br>\n     &phi;<sub>i<\/sub> comes from the Pitzer virial correlation: ln &phi; = (Pr / Tr)(B0 + &omega; B1), B0 = 0.083 - 0.422 / Tr<sup>1.6<\/sup>, B1 = 0.139 - 0.172 / Tr<sup>4.2<\/sup>. Since &phi; depends on T, T is found by bisection again.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n  <h2 style=\"margin-top:14px\">Extra table: how K and y(NH3) change with temperature (ideal gas)<\/h2>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\nvar nu = [-1, -3, 2];      // stoichiometric numbers for N2, H2, NH3\nvar T0 = 298.15;\n\n// ln K at temperature T (K)\nfunction lnK(T) {\n  var R = get(\"R\");\n  var dA = 0, dB = 0, dD = 0, dH0 = 0, dG0 = 0;\n  for (var i = 0; i < 3; i++) {\n    dA += nu[i] * get(\"A\" + i);\n    dB += nu[i] * get(\"B\" + i) * 1e-3;\n    dD += nu[i] * get(\"D\" + i) * 1e5;\n    dH0 += nu[i] * get(\"H\" + i);\n    dG0 += nu[i] * get(\"G\" + i);\n  }\n  var I1 = dA * (T - T0) + dB / 2 * (T * T - T0 * T0) - dD * (1 / T - 1 / T0);\n  var I2 = dA * Math.log(T / T0) + dB * (T - T0) - dD / 2 * (1 / (T * T) - 1 / (T0 * T0));\n  var dGoverRT = (dG0 - dH0) / (R * T0) + dH0 / (R * T) + I1 / T - I2;\n  return -dGoverRT;\n}\n\n// ratio y(NH3)^2 / (y(N2) * y(H2)^3) for extent e (basis: 1 mol N2 and r mol H2)\nfunction yratio(e) {\n  var r = get(\"r\");\n  var nt = 1 + r - 2 * e;\n  var yN = (1 - e) / nt, yH = (r - 3 * e) / nt, yA = 2 * e / nt;\n  return yA * yA / (yN * Math.pow(yH, 3));\n}\n\n// extent of reaction from K and P (ideal gas): K = yratio * (1/P)^2\nfunction extentFromK(K, P) {\n  var r = get(\"r\");\n  var lo = 0, hi = Math.min(1, r / 3) - 1e-12;\n  for (var n = 0; n < 200; n++) {\n    var mid = (lo + hi) / 2;\n    if (yratio(mid) / (P * P) < K) lo = mid; else hi = mid;\n  }\n  return (lo + hi) / 2;\n}\nfunction yNH3(e) {\n  return 2 * e / (1 + get(\"r\") - 2 * e);\n}\n\n// Pitzer virial correlation: fugacity coefficient of pure species i at T and P\nfunction phi(i, T, P) {\n  var Tr = T / get(\"Tc\" + i), Pr = P / get(\"Pc\" + i), w = get(\"w\" + i);\n  var B0 = 0.083 - 0.422 / Math.pow(Tr, 1.6);\n  var B1 = 0.139 - 0.172 / Math.pow(Tr, 4.2);\n  return Math.exp(Pr / Tr * (B0 + w * B1));\n}\n\n// find T where g(T) = 0 by bisection (g decreases with T)\nfunction findT(g) {\n  var lo = 300, hi = 1500;\n  for (var n = 0; n < 100; n++) {\n    var mid = (lo + hi) / 2;\n    if (g(mid) > 0) lo = mid; else hi = mid;\n  }\n  return (lo + hi) / 2;\n}\n\nfunction solve() {\n  var P1 = get(\"P1\"), P2 = get(\"P2\"), r = get(\"r\"), yt = get(\"ytar\");\n\n  // (a) y(NH3) at 300 K, P1\n  var K300 = Math.exp(lnK(300));\n  var ea = extentFromK(K300, P1);\n  var ya = yNH3(ea);\n\n  // for the target y(NH3), the extent and the y-ratio are fixed\n  var et = yt * (1 + r) / (2 * (1 + yt));\n  var Yr = yratio(et);\n\n  // (b) ideal gas, P1:  ln K = ln( Yr / P1^2 )\n  var Tb = findT(function (T) { return lnK(T) - Math.log(Yr / (P1 * P1)); });\n\n  // (c) ideal gas, P2\n  var Tc = findT(function (T) { return lnK(T) - Math.log(Yr / (P2 * P2)); });\n\n  // (d) ideal solution of real gases, P2:  K = Yr * Phi / P^2, Phi = phi(NH3)^2 / (phi(N2) phi(H2)^3)\n  function Phi(T) { return Math.pow(phi(2, T, P2), 2) / (phi(0, T, P2) * Math.pow(phi(1, T, P2), 3)); }\n  var Td = findT(function (T) { return lnK(T) - Math.log(Yr * Phi(T) / (P2 * P2)); });\n\n  document.getElementById(\"answers\").innerHTML =\n    \"K at 300 K = \" + K300.toExponential(3) + \"<br>\" +\n    \"<b>(a)<\/b> At 300 K and \" + P1 + \" bar: &epsilon; = \" + ea.toFixed(4) + \", y(NH3) = \" + ya.toFixed(4) +\n      \" (y(N2) = \" + ((1 - ea) / (1 + r - 2 * ea)).toFixed(4) + \", y(H2) = \" + ((r - 3 * ea) / (1 + r - 2 * ea)).toFixed(4) + \")<br>\" +\n    \"<b>(b)<\/b> y(NH3) = \" + yt + \" at \" + P1 + \" bar (ideal gas): T = \" + Tb.toFixed(1) + \" K (\" + (Tb - 273.15).toFixed(1) + \" &deg;C), K = \" + Math.exp(lnK(Tb)).toExponential(3) + \"<br>\" +\n    \"<b>(c)<\/b> y(NH3) = \" + yt + \" at \" + P2 + \" bar (ideal gas): T = \" + Tc.toFixed(1) + \" K (\" + (Tc - 273.15).toFixed(1) + \" &deg;C), K = \" + Math.exp(lnK(Tc)).toExponential(3) + \"<br>\" +\n    \"<b>(d)<\/b> y(NH3) = \" + yt + \" at \" + P2 + \" bar (ideal solution of real gases): T = \" + Td.toFixed(1) + \" K (\" + (Td - 273.15).toFixed(1) + \" &deg;C)<br>\" +\n    \"&nbsp;&nbsp;&nbsp;&nbsp;at this T: &phi;(N2) = \" + phi(0, Td, P2).toFixed(4) + \", &phi;(H2) = \" + phi(1, Td, P2).toFixed(4) + \", &phi;(NH3) = \" + phi(2, Td, P2).toFixed(4);\n\n  // extra table\n  var html = \"<tr><th>T (K)<\/th><th>K<\/th><th>y(NH3) at \" + P1 + \" bar<\/th><th>y(NH3) at \" + P2 + \" bar<\/th><\/tr>\";\n  for (var T = 300; T <= 800; T += 100) {\n    var K = Math.exp(lnK(T));\n    html += \"<tr><td>\" + T + \"<\/td><td>\" + K.toExponential(3) + \"<\/td><td>\" + yNH3(extentFromK(K, P1)).toFixed(4) +\n            \"<\/td><td>\" + yNH3(extentFromK(K, P2)).toFixed(4) + \"<\/td><\/tr>\";\n  }\n  document.getElementById(\"table\").innerHTML = html;\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "13.29": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 13.29 - H2S and SO2 removal<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 230px; margin: 4px 0; font-size: 14px; }\n  input { width: 85px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 13.29 - Removing H<sub>2<\/sub>S and SO<sub>2<\/sub> together<\/h1>\n  <p>2 H<sub>2<\/sub>S(g) + SO<sub>2<\/sub>(g) &rarr; 3 S(s) + 2 H<sub>2<\/sub>O(g) &nbsp; Reactants in the stoichiometric proportion (2 : 1). Estimate the percent conversion of each reactant at equilibrium at 450 &deg;C and 8 bar.<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data<\/h2>\n  <label>Temperature (&deg;C)<\/label> <input id=\"tc\" value=\"450\"><br>\n  <label>Pressure P (bar)<\/label> <input id=\"P\" value=\"8\"><br>\n  <label>R (J/mol K)<\/label> <input id=\"R\" value=\"8.314\"><br>\n  <p class=\"small\">Cp/R = A + B T + D T<sup>-2<\/sup> (B in 10<sup>-3<\/sup>, D in 10<sup>5<\/sup>). Gases from Table C.1, solid sulfur from Table C.3, &Delta;Hf and &Delta;Gf from Table C.4 (J/mol). Check these against your book.<\/p>\n  <table>\n    <tr><th>Species<\/th><th>&nu;<\/th><th>A<\/th><th>B x 10<sup>3<\/sup><\/th><th>D x 10<sup>-5<\/sup><\/th><th>&Delta;Hf 298<\/th><th>&Delta;Gf 298<\/th><\/tr>\n    <tr><td>H<sub>2<\/sub>S(g)<\/td><td>-2<\/td><td><input id=\"A0\" value=\"3.931\"><\/td><td><input id=\"B0\" value=\"1.490\"><\/td><td><input id=\"D0\" value=\"-0.232\"><\/td><td><input id=\"H0\" value=\"-20630\"><\/td><td><input id=\"G0\" value=\"-33560\"><\/td><\/tr>\n    <tr><td>SO<sub>2<\/sub>(g)<\/td><td>-1<\/td><td><input id=\"A1\" value=\"5.699\"><\/td><td><input id=\"B1\" value=\"0.801\"><\/td><td><input id=\"D1\" value=\"-1.015\"><\/td><td><input id=\"H1\" value=\"-296830\"><\/td><td><input id=\"G1\" value=\"-300194\"><\/td><\/tr>\n    <tr><td>S(s)<\/td><td>3<\/td><td><input id=\"A2\" value=\"4.114\"><\/td><td><input id=\"B2\" value=\"-1.728\"><\/td><td><input id=\"D2\" value=\"-0.783\"><\/td><td><input id=\"H2\" value=\"0\"><\/td><td><input id=\"G2\" value=\"0\"><\/td><\/tr>\n    <tr><td>H<sub>2<\/sub>O(g)<\/td><td>2<\/td><td><input id=\"A3\" value=\"3.470\"><\/td><td><input id=\"B3\" value=\"1.450\"><\/td><td><input id=\"D3\" value=\"0.121\"><\/td><td><input id=\"H3\" value=\"-241818\"><\/td><td><input id=\"G3\" value=\"-228572\"><\/td><\/tr>\n  <\/table>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Step 1.<\/b> Standard changes at 298 K: &Delta;H&deg;298 = &Sigma; &nu;<sub>i<\/sub> &Delta;Hf<sub>i<\/sub> and &Delta;G&deg;298 = &Sigma; &nu;<sub>i<\/sub> &Delta;Gf<sub>i<\/sub>, with &nu; = -2 (H<sub>2<\/sub>S), -1 (SO<sub>2<\/sub>), +3 (S), +2 (H<sub>2<\/sub>O). In the same way &Delta;A, &Delta;B, &Delta;D come from the Cp constants.<\/p>\n  <p><b>Step 2.<\/b> K at T (van 't Hoff with changing &Delta;H):<br>\n     &Delta;G&deg;/RT = (&Delta;G&deg;298 - &Delta;H&deg;298) / (R T0) + &Delta;H&deg;298 / (R T) + (1/T) &int; (&Delta;Cp/R) dT - &int; (&Delta;Cp/R) dT / T &nbsp; (T0 = 298.15 K), K = exp( -&Delta;G&deg;/RT ).<\/p>\n  <p><b>Step 3.<\/b> Pure solid sulfur has activity 1, so only the gases appear in K:<br>\n     K = (y<sub>H2O<\/sub> P/P&deg;)<sup>2<\/sup> / [ (y<sub>H2S<\/sub> P/P&deg;)<sup>2<\/sup> (y<sub>SO2<\/sub> P/P&deg;) ] = y<sub>H2O<\/sub><sup>2<\/sup> / ( y<sub>H2S<\/sub><sup>2<\/sup> y<sub>SO2<\/sub> ) &times; (P&deg;/P), with P&deg; = 1 bar.<\/p>\n  <p><b>Step 4.<\/b> Mole balance on 2 mol H<sub>2<\/sub>S and 1 mol SO<sub>2<\/sub>, extent &epsilon;: H<sub>2<\/sub>S = 2 - 2&epsilon;, SO<sub>2<\/sub> = 1 - &epsilon;, H<sub>2<\/sub>O = 2&epsilon;, S(s) = 3&epsilon;. Only the gases count in the total: n = 3 - &epsilon;.<\/p>\n  <p><b>Step 5.<\/b> Put the mole fractions in terms of &epsilon;. This simplifies to<br>\n     K P = &epsilon;<sup>2<\/sup> (3 - &epsilon;) / (1 - &epsilon;)<sup>3<\/sup><br>\n     Solve for &epsilon; (bisection). Both reactants are fed in the stoichiometric ratio, so they have the same conversion, equal to &epsilon;.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\nfunction solve() {\n  var R = get(\"R\");\n  var T = get(\"tc\") + 273.15;\n  var T0 = 298.15;\n  var P = get(\"P\");\n  var nu = [-2, -1, 3, 2];\n\n  // Step 1: sums over the four species\n  var dA = 0, dB = 0, dD = 0, dH0 = 0, dG0 = 0;\n  for (var i = 0; i < 4; i++) {\n    dA += nu[i] * get(\"A\" + i);\n    dB += nu[i] * get(\"B\" + i) * 1e-3;\n    dD += nu[i] * get(\"D\" + i) * 1e5;\n    dH0 += nu[i] * get(\"H\" + i);\n    dG0 += nu[i] * get(\"G\" + i);\n  }\n\n  // Step 2: K at T\n  var I1 = dA * (T - T0) + dB / 2 * (T * T - T0 * T0) - dD * (1 / T - 1 / T0);\n  var I2 = dA * Math.log(T / T0) + dB * (T - T0) - dD / 2 * (1 / (T * T) - 1 / (T0 * T0));\n  var dGoverRT = (dG0 - dH0) / (R * T0) + dH0 / (R * T) + I1 / T - I2;\n  var K = Math.exp(-dGoverRT);\n\n  // Step 5: solve K*P = e^2 (3 - e) / (1 - e)^3 for e between 0 and 1\n  function f(e) { return e * e * (3 - e) / Math.pow(1 - e, 3); }\n  var lo = 0, hi = 1 - 1e-12;\n  for (var n = 0; n < 200; n++) {\n    var mid = (lo + hi) / 2;\n    if (f(mid) < K * P) lo = mid; else hi = mid;\n  }\n  var e = (lo + hi) / 2;\n\n  var nH2S = 2 - 2 * e, nSO2 = 1 - e, nH2O = 2 * e, nS = 3 * e, ng = 3 - e;\n\n  document.getElementById(\"answers\").innerHTML =\n    \"&Delta;H&deg;298 = \" + dH0.toFixed(0) + \" J/mol, &Delta;G&deg;298 = \" + dG0.toFixed(0) + \" J/mol<br>\" +\n    \"&Delta;A = \" + dA.toFixed(3) + \", &Delta;B = \" + dB.toExponential(3) + \", &Delta;D = \" + dD.toExponential(3) + \"<br>\" +\n    \"At T = \" + T.toFixed(2) + \" K: &Delta;G&deg; = \" + (dGoverRT * R * T).toFixed(0) + \" J/mol, K = \" + K.toFixed(4) + \", K P = \" + (K * P).toFixed(3) + \"<br>\" +\n    \"Extent of reaction &epsilon; = \" + e.toFixed(4) + \"<br>\" +\n    \"<b>Conversion of H2S = \" + (e * 100).toFixed(2) + \" %, conversion of SO2 = \" + (e * 100).toFixed(2) + \" %<\/b>\";\n\n  document.getElementById(\"table\").innerHTML =\n    \"<tr><th>Species<\/th><th>Moles at start<\/th><th>Moles at equilibrium<\/th><th>Gas mole fraction<\/th><\/tr>\" +\n    \"<tr><td>H2S(g)<\/td><td>2<\/td><td>\" + nH2S.toFixed(4) + \"<\/td><td>\" + (nH2S / ng).toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>SO2(g)<\/td><td>1<\/td><td>\" + nSO2.toFixed(4) + \"<\/td><td>\" + (nSO2 / ng).toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>H2O(g)<\/td><td>0<\/td><td>\" + nH2O.toFixed(4) + \"<\/td><td>\" + (nH2O / ng).toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>S(s)<\/td><td>0<\/td><td>\" + nS.toFixed(4) + \"<\/td><td>(solid, not in the gas)<\/td><\/tr>\";\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n", "13.31": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Problem 13.31 - Liquid-phase isomerization<\/title>\n<style>\n  body { font-family: Verdana, sans-serif; background: #fdf6e9; color: #222; margin: 0; padding: 20px; }\n  .box { max-width: 900px; margin: 0 auto 20px auto; background: white; border: 2px solid #8b5e34; padding: 16px; }\n  h1 { margin: 0 0 4px 0; font-size: 22px; color: #6b3f12; }\n  h2 { margin: 0 0 10px 0; font-size: 18px; color: #6b3f12; }\n  .small { font-size: 13px; color: #555; }\n  label { display: inline-block; width: 260px; margin: 4px 0; font-size: 14px; }\n  input { width: 90px; padding: 3px; }\n  button { background: #8b5e34; color: white; border: none; padding: 8px 18px; font-size: 15px; cursor: pointer; margin-top: 10px; }\n  table { border-collapse: collapse; width: 100%; font-size: 14px; }\n  th, td { border: 1px solid #bbb; padding: 5px; text-align: center; }\n  th { background: #f0e0c8; }\n  .answer { background: #fff3cd; padding: 8px; margin: 6px 0; font-size: 15px; line-height: 1.7; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"box\">\n  <h1>Problem 13.31 - Isomerization A &rarr; B in the liquid phase<\/h1>\n  <p>A and B are miscible liquids with G<sup>E<\/sup>/RT = 0.1 x<sub>A<\/sub> x<sub>B<\/sub>. Given &Delta;G&deg;298 = -1000 J. Find the equilibrium composition at 25 &deg;C, and the error if A and B are assumed to form an ideal solution.<\/p>\n  <p class=\"small\">Name: Zoher Nalawala &nbsp;|&nbsp; Roll No: U24CH037 &nbsp;|&nbsp; Subject: CET-II (Chemical Engineering Thermodynamics II)<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>1. Given data<\/h2>\n  <label>Temperature (&deg;C)<\/label> <input id=\"tc\" value=\"25\"><br>\n  <label>&Delta;G&deg; at this T (J/mol)<\/label> <input id=\"dG\" value=\"-1000\"><br>\n  <label>Coefficient in G<sup>E<\/sup>/RT = a x<sub>A<\/sub> x<sub>B<\/sub>, a =<\/label> <input id=\"a\" value=\"0.1\"><br>\n  <label>R (J/mol K)<\/label> <input id=\"R\" value=\"8.314\"><br>\n  <button onclick=\"solve()\">Calculate<\/button>\n<\/div>\n\n<div class=\"box\">\n  <h2>2. Steps (what we do and why)<\/h2>\n  <p><b>Step 1.<\/b> The equilibrium constant from the standard Gibbs energy change (the temperature is 298.15 K, the same as the data, so no correction is needed):<br>\n     K = exp( -&Delta;G&deg; / RT )<\/p>\n  <p><b>Step 2.<\/b> For a liquid reaction the standard state is the pure liquid, so K is a ratio of activities:<br>\n     K = a<sub>B<\/sub> / a<sub>A<\/sub> = (&gamma;<sub>B<\/sub> x<sub>B<\/sub>) / (&gamma;<sub>A<\/sub> x<sub>A<\/sub>), with x<sub>A<\/sub> + x<sub>B<\/sub> = 1.<\/p>\n  <p><b>Step 3 (ideal solution).<\/b> &gamma; = 1, so K = x<sub>B<\/sub> / x<sub>A<\/sub>, which gives x<sub>B<\/sub> = K / (1 + K).<\/p>\n  <p><b>Step 4 (real solution).<\/b> From G<sup>E<\/sup>/RT = a x<sub>A<\/sub> x<sub>B<\/sub> the activity coefficients are<br>\n     ln &gamma;<sub>A<\/sub> = a x<sub>B<\/sub><sup>2<\/sup> and ln &gamma;<sub>B<\/sub> = a x<sub>A<\/sub><sup>2<\/sup>.<br>\n     Taking logs of K = (&gamma;<sub>B<\/sub> x<sub>B<\/sub>) / (&gamma;<sub>A<\/sub> x<sub>A<\/sub>):<br>\n     ln K = ln(x<sub>B<\/sub> / x<sub>A<\/sub>) + a (x<sub>A<\/sub><sup>2<\/sup> - x<sub>B<\/sub><sup>2<\/sup>) = ln(x<sub>B<\/sub> / x<sub>A<\/sub>) + a (1 - 2 x<sub>B<\/sub>)<br>\n     This is solved for x<sub>B<\/sub> by bisection in the code.<\/p>\n  <p><b>Step 5.<\/b> Compare the two x<sub>B<\/sub> values to get the error from the ideal solution assumption.<\/p>\n<\/div>\n\n<div class=\"box\">\n  <h2>3. Results<\/h2>\n  <div id=\"answers\" class=\"answer\">Press the Calculate button.<\/div>\n  <table id=\"table\"><\/table>\n<\/div>\n\n<\u0073cript>\n// get a number from an input box\nfunction get(id) {\n  return parseFloat(document.getElementById(id).value);\n}\n\nfunction solve() {\n  var R = get(\"R\");\n  var T = get(\"tc\") + 273.15;\n  var a = get(\"a\");\n\n  // Step 1: equilibrium constant\n  var K = Math.exp(-get(\"dG\") / (R * T));\n  var lnK = Math.log(K);\n\n  // Step 3: ideal solution\n  var xBi = K / (1 + K);\n  var xAi = 1 - xBi;\n\n  // Step 4: real solution, solve  ln(xB/xA) + a(1 - 2 xB) - ln K = 0  for xB (bisection)\n  function f(xB) { return Math.log(xB / (1 - xB)) + a * (1 - 2 * xB) - lnK; }\n  var lo = 1e-9, hi = 1 - 1e-9;\n  for (var n = 0; n < 200; n++) {\n    var mid = (lo + hi) / 2;\n    if (f(mid) < 0) lo = mid; else hi = mid;\n  }\n  var xB = (lo + hi) / 2;\n  var xA = 1 - xB;\n  var gA = Math.exp(a * xB * xB);\n  var gB = Math.exp(a * xA * xA);\n\n  // Step 5: error from the ideal solution assumption\n  var errB = (xBi - xB) / xB * 100;\n  var errA = (xAi - xA) / xA * 100;\n\n  document.getElementById(\"answers\").innerHTML =\n    \"T = \" + T.toFixed(2) + \" K, K = exp(-&Delta;G&deg;/RT) = \" + K.toFixed(4) + \"<br>\" +\n    \"<b>Real solution:<\/b> x(A) = \" + xA.toFixed(4) + \", x(B) = \" + xB.toFixed(4) + \" (&gamma;A = \" + gA.toFixed(4) + \", &gamma;B = \" + gB.toFixed(4) + \")<br>\" +\n    \"<b>Ideal solution:<\/b> x(A) = \" + xAi.toFixed(4) + \", x(B) = \" + xBi.toFixed(4) + \"<br>\" +\n    \"<b>Error from assuming an ideal solution:<\/b> x(B) is off by \" + (xBi - xB).toFixed(4) + \" (\" + errB.toFixed(2) + \" %), x(A) is off by \" + (xAi - xA).toFixed(4) + \" (\" + errA.toFixed(2) + \" %)\";\n\n  document.getElementById(\"table\").innerHTML =\n    \"<tr><th><\/th><th>x(A)<\/th><th>x(B)<\/th><th>gamma(A)<\/th><th>gamma(B)<\/th><\/tr>\" +\n    \"<tr><td>Real solution<\/td><td>\" + xA.toFixed(4) + \"<\/td><td>\" + xB.toFixed(4) + \"<\/td><td>\" + gA.toFixed(4) + \"<\/td><td>\" + gB.toFixed(4) + \"<\/td><\/tr>\" +\n    \"<tr><td>Ideal solution<\/td><td>\" + xAi.toFixed(4) + \"<\/td><td>\" + xBi.toFixed(4) + \"<\/td><td>1<\/td><td>1<\/td><\/tr>\";\n}\n\n// run once when the page opens\nsolve();\n<\/script>\n\n<\/body>\n<\/html>\n"};
</script>
